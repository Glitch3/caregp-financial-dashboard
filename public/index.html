<body class="bg-[#060c18] text-slate-100 min-h-screen font-sans antialiased selection:bg-[#0066ff] selection:text-white transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      TrendingUp, DollarSign, Clock, Building2, FileText, CheckCircle2, 
      AlertCircle, Search, RefreshCw, ArrowUpRight, ArrowDownRight, 
      ChevronDown, ChevronUp, Filter, Users, Cpu, ShieldCheck, Zap, Activity, Info, 
      Calculator, ArrowRight, X, ExternalLink, Calendar, HelpCircle,
      PieChart as PieIcon, Layers, Target, Scale, Award, Percent, BarChart3,
      Mic, Receipt, Sparkles, AlertTriangle, Moon, Sun, Shield, Check, Crosshair,
      BookOpen, Code, CheckSquare, ListFilter, Terminal
    } from 'lucide-react';
    import { 
      ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, 
      Cell, PieChart, Pie, Legend
    } from 'recharts';

    // FORMULAS CATALOG DICTIONARY
    const FORMULAS_CATALOG = {
      arr: {
        id: 'arr',
        title: 'Annual Recurring Revenue (ARR)',
        category: 'Financial Core',
        equation: 'Live ARR = ∑ (Monthly Subscription_c × 12)',
        latex: 'ARR = \\sum_{c \\in Active} (Sub_c \\times 12)',
        explanation: 'Sum of all annualized recurring active clinic contracts across monthly and annual plans.',
        sheetSource: 'Sheet Col O (numGps) × Rate × Agent Multiplier × 12',
        inputs: [
          { name: 'Active Clinics', value: 'Clinics with status ≠ Dropped Off' },
          { name: 'Monthly Sub', value: 'numGps × Rate × Multiplier' },
          { name: 'Annualization Factor', value: '12 Months' }
        ],
        example: 'If Clinic A has 5 GPs on Annual Plan ($105/mo/GP) with 2 Agents (1.5x): Sub = 5 × $105 × 1.5 = $787.50/mo. ARR = $787.50 × 12 = $9,450/yr.'
      },
      mrr: {
        id: 'mrr',
        title: 'Monthly Recurring Revenue (MRR)',
        category: 'Financial Core',
        equation: 'Live MRR = Total Live ARR ÷ 12',
        latex: 'MRR = \\frac{\\text{Live ARR}}{12}',
        explanation: 'Normalized monthly recurring subscription revenue stream from all active clinic accounts.',
        sheetSource: 'Derived directly from Live ARR',
        inputs: [
          { name: 'Total Live ARR', value: 'Sum of all active clinic ARRs' },
          { name: 'Months per Year', value: '12' }
        ],
        example: '$520,000 Total ARR ÷ 12 = $43,333.33 MRR'
      },
      arpu: {
        id: 'arpu',
        title: 'Average Revenue Per Practice / User (ARPU)',
        category: 'Unit Economics',
        equation: 'ARPU = Total Category ARR ÷ Active Category Clinics',
        latex: 'ARPU = \\frac{\\text{Total Segment ARR}}{\\text{Active Segment Clinics}}',
        explanation: 'Measures average annual contract value per practice within a specific size or payment category.',
        sheetSource: 'Category Total Live ARR ÷ Category Active Clinic Count',
        inputs: [
          { name: 'Total Category ARR', value: 'Sum of ARR in tier' },
          { name: 'Active Category Clinics', value: 'Active clinics in tier' }
        ],
        example: 'Small Practice Segment: $148,500 ARR ÷ 18 Active Clinics = $8,250 ARPU'
      },
      nrr: {
        id: 'nrr',
        title: 'Net Revenue Retention (NRR)',
        category: 'SaaS Retention',
        equation: 'NRR % = [(Start ARR + Expansion ARR - Churn ARR - Downgrade ARR) ÷ Start ARR] × 100',
        latex: 'NRR = \\frac{\\text{Start ARR} + \\text{Expansion} - \\text{Churn} - \\text{Downgrade}}{\\text{Start ARR}} \\times 100\\%',
        explanation: 'Measures net revenue growth from an existing cohort including multi-agent upsells minus cancellations.',
        sheetSource: 'SaaS Cohort Analytics Engine',
        inputs: [
          { name: 'Start Cohort ARR', value: 'Baseline ARR' },
          { name: 'Expansion ARR', value: 'Voice & Billing Agent upgrades' },
          { name: 'Churn & Downgrades', value: 'Canceled / reduced contracts' }
        ],
        example: '($400,000 + $96,000 - $24,000 - $8,000) ÷ $400,000 = $464,000 ÷ $400,000 = 116.0% NRR'
      },
      grr: {
        id: 'grr',
        title: 'Gross Revenue Retention (GRR)',
        category: 'SaaS Retention',
        equation: 'GRR % = [(Start ARR - Churn ARR - Downgrade ARR) ÷ Start ARR] × 100',
        latex: 'GRR = \\frac{\\text{Start ARR} - \\text{Churn} - \\text{Downgrade}}{\\text{Start ARR}} \\times 100\\%',
        explanation: 'Measures percentage of baseline revenue retained from existing customers without counting expansion.',
        sheetSource: 'SaaS Cohort Analytics Engine',
        inputs: [
          { name: 'Start Cohort ARR', value: 'Baseline ARR' },
          { name: 'Churn & Downgrades', value: 'Lost ARR' }
        ],
        example: '($400,000 - $24,000 - $8,000) ÷ $400,000 = $368,000 ÷ $400,000 = 92.0% GRR'
      },
      logoChurn: {
        id: 'logoChurn',
        title: 'Logo Churn Rate %',
        category: 'Customer Retention',
        equation: 'Logo Churn % = (Dropped Off Clinics ÷ Total Onboarded Clinics) × 100',
        latex: '\\text{Logo Churn} = \\frac{N_{\\text{Dropped Off}}}{N_{\\text{Total}}} \\times 100\\%',
        explanation: 'Percentage of onboarded clinics that dropped off or canceled their pilot/subscription.',
        sheetSource: 'Sheet Col C (Status = "Dropped Off")',
        inputs: [
          { name: 'Dropped Off Clinics', value: 'Count of status = "Dropped Off"' },
          { name: 'Total Onboarded', value: 'Total clinic rows in dataset' }
        ],
        example: '2 Dropped Off Clinics ÷ 32 Onboarded Clinics = 6.25% Logo Churn'
      },
      runway: {
        id: 'runway',
        title: 'Cash Runway (Months)',
        category: 'Capital Efficiency',
        equation: 'Cash Runway = Total Cash Balance ÷ Net Monthly Cash Burn',
        latex: '\\text{Runway} = \\frac{\\text{Cash Balance}}{\\text{Monthly Net Burn}}',
        explanation: 'Number of operating months remaining before cash balance reaches zero at current net burn rate.',
        sheetSource: 'Balance Sheet Cash Reserves ÷ Monthly Cash Loss',
        inputs: [
          { name: 'Cash Balance', value: '$2,400,000 AUD' },
          { name: 'Net Monthly Burn', value: '$85,000 AUD/mo' }
        ],
        example: '$2,400,000 ÷ $85,000 = 28.24 Months Runway'
      },
      burnMultiple: {
        id: 'burnMultiple',
        title: 'Burn Multiple',
        category: 'Capital Efficiency',
        equation: 'Burn Multiple = (Net Monthly Cash Burn × 12) ÷ Net New ARR Generated',
        latex: '\\text{Burn Multiple} = \\frac{\\text{Net Burn} \\times 12}{\\Delta \\text{ARR}}',
        explanation: 'Measures net cash consumed per dollar of net new ARR generated (< 2.0x is top tier capital efficiency).',
        sheetSource: 'Annualized Net Operating Cash Loss ÷ Annualized Net New ARR',
        inputs: [
          { name: 'Annualized Cash Burn', value: '$85,000 × 12 = $1,020,000' },
          { name: 'Net New ARR', value: 'New + Expansion ARR - Churn ARR ($560,000)' }
        ],
        example: '$1,020,000 ÷ $560,000 = 1.82x Burn Multiple'
      },
      quickRatio: {
        id: 'quickRatio',
        title: 'SaaS Quick Ratio',
        category: 'SaaS Growth',
        equation: 'Quick Ratio = (New MRR + Expansion MRR) ÷ (Churned MRR + Contraction MRR)',
        latex: '\\text{Quick Ratio} = \\frac{\\text{New MRR} + \\text{Expansion MRR}}{\\text{Churn MRR} + \\text{Contraction MRR}}',
        explanation: 'Growth velocity ratio measuring revenue added for every dollar of revenue lost (> 4.0x indicates strong growth).',
        sheetSource: 'MRR Growth Analysis',
        inputs: [
          { name: 'New + Expansion MRR', value: '$12,000/mo' },
          { name: 'Churn + Contraction MRR', value: '$2,500/mo' }
        ],
        example: '$12,000 ÷ $2,500 = 4.80x Quick Ratio'
      },
      ruleOf40: {
        id: 'ruleOf40',
        title: 'Rule of 40 Score',
        category: 'Valuation & Performance',
        equation: 'Rule of 40 = YoY ARR Growth Rate (%) + Operating Cash Margin (%)',
        latex: '\\text{Rule of 40} = g_{\\text{ARR}} + \\text{Margin}',
        explanation: 'SaaS benchmark evaluating growth vs profitability. Scores > 40 denote top-performing software platforms.',
        sheetSource: 'YoY Growth Rate + Net Margin',
        inputs: [
          { name: 'YoY ARR Growth Rate', value: '128.5%' },
          { name: 'Operating Margin', value: '-26.4%' }
        ],
        example: '128.5% + (-26.4%) = 102.1 Rule of 40 Score'
      },
      hoursSaved: {
        id: 'hoursSaved',
        title: 'Doctor Hours Saved',
        category: 'Operational Impact',
        equation: 'Hours Saved = Uploads × (180s Baseline - Processing Sec) ÷ 3600',
        latex: '\\text{Hours Saved} = \\frac{\\text{Uploads} \\times (180\\text{s} - T_{\\text{doc}})}{3600}',
        explanation: 'Calculates clinical administrative hours saved by comparing document processing speed to the 180s (3 min) manual baseline.',
        sheetSource: 'Sheet Col R (totalHoursSaved) or Col E (uploads) & Col P (timePerDocSec)',
        inputs: [
          { name: 'Manual Baseline', value: '180 seconds (3 mins / doc)' },
          { name: 'CareGP Speed', value: 'Sheet Col P (avg 20s)' },
          { name: 'Total Uploads', value: 'Sheet Col E' }
        ],
        example: '1,200 uploads × (180s - 20s) ÷ 3600 = 1,200 × 160 ÷ 3600 = 53.33 Hours Saved'
      },
      financialSavings: {
        id: 'financialSavings',
        title: 'Financial Value Saved ($)',
        category: 'Operational Impact',
        equation: 'Financial Savings ($) = Total Doctor Hours Saved × $120/hr GP Rate',
        latex: '\\text{Financial Savings} = \\text{Hours Saved} \\times \\$120/\\text{hr}',
        explanation: 'Translates doctor clinical hours saved into financial savings based on the standard $120 AUD/hr GP cost rate.',
        sheetSource: 'Sheet Col S (financialSavings)',
        inputs: [
          { name: 'Hours Saved', value: 'Total Doctor Hours Saved' },
          { name: 'GP Blended Rate', value: '$120 AUD / hour' }
        ],
        example: '2,400 Hours Saved × $120/hr = $288,000 AUD Financial Savings'
      },
      pricingModel: {
        id: 'pricingModel',
        title: 'CareGP Subscription & Discount Matrix',
        category: 'Pricing Logic',
        equation: 'Monthly Sub = GP Seats × Schedule Rate × Agent Multiplier',
        latex: '\\text{Sub} = \\text{numGps} \\times \\text{Rate} \\times \\text{AgentMult}',
        explanation: 'Base rate per GP: $125/mo for Monthly, $105/mo for Annual (16% discount). Agent multipliers: 1 Agent = 1.0x, 2 Agents = 1.5x, 3 Agents = 2.1x.',
        sheetSource: 'Sheet Col O (numGps) & Multi-agent selection',
        inputs: [
          { name: 'Monthly Base Rate', value: '$125 / GP / month' },
          { name: 'Annual Base Rate', value: '$105 / GP / month (16% OFF)' },
          { name: 'Agent Multipliers', value: '1 Agent (1.0x) | 2 Agents (1.5x) | 3 Agents (2.1x)' }
        ],
        example: '8 GPs on Annual Plan with 3 Agents: 8 × $105 × 2.1 = $1,764/mo ($21,168 ARR)'
      },
      roiMultiplier: {
        id: 'roiMultiplier',
        title: 'Clinic ROI Multiplier',
        category: 'Pricing Logic',
        equation: 'ROI Multiplier = Financial Value Saved ($) ÷ Annual CareGP Subscription ($)',
        latex: '\\text{ROI} = \\frac{\\text{Financial Savings}}{\\text{Annual Subscription}}',
        explanation: 'Measures return on investment delivered to the clinic per dollar spent on CareGP subscriptions.',
        sheetSource: 'Sheet Col X (roiMultiplier)',
        inputs: [
          { name: 'Financial Savings', value: 'Hours Saved × $120/hr' },
          { name: 'Annual CareGP Sub', value: 'Annual Subscription Cost' }
        ],
        example: '$288,000 Financial Savings ÷ $21,168 Subscription = 13.6x Net ROI'
      }
    };

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);

      // Filters for Directory
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [sizeFilter, setSizeFilter] = useState('All');
      const [paymentFilter, setPaymentFilter] = useState('All');

      // Tabs: 'summary', 'segmentation', 'saas', 'directory', 'calculator', 'formulas'
      const [activeTab, setActiveTab] = useState('summary');
      const [selectedClinic, setSelectedClinic] = useState(null);
      const [selectedFormulaKey, setSelectedFormulaKey] = useState(null);

      // Sorting
      const [sortField, setSortField] = useState('arr');
      const [sortDirection, setSortDir] = useState('desc');
      const [isDarkMode, setIsDarkMode] = useState(true);

      // Calculator state
      const [calcGps, setCalcGps] = useState(6);
      const [calcSchedule, setCalcSchedule] = useState('Annual');
      const [calcAgents, setCalcAgents] = useState(2); // 1, 2, or 3

      // Interactive Audit Tool state in Tab 6
      const [auditClinicIndex, setAuditClinicIndex] = useState(0);

      // Theme toggle
      const toggleTheme = () => {
        const nextMode = !isDarkMode;
        setIsDarkMode(nextMode);
        if (nextMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      const fetchData = async (force = false) => {
        if (force) setRefreshing(true);
        else setLoading(true);
        setError(null);

        try {
          const url = force ? './api/dashboard?refresh=true' : './api/dashboard';
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          setData(json);
        } catch (err) {
          console.error(err);
          setError(err.message || 'Failed to fetch dashboard data');
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Filtered clinics
      const filteredClinics = useMemo(() => {
        if (!data?.clinics) return [];
        return data.clinics.filter(c => {
          const matchesSearch = searchQuery === '' || 
            c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.comments.toLowerCase().includes(searchQuery.toLowerCase());

          const matchesStatus = statusFilter === 'All' || c.status === statusFilter;
          const matchesSize = sizeFilter === 'All' || c.clinicSizeKey === sizeFilter;
          const matchesPayment = paymentFilter === 'All' || c.paymentSchedule === paymentFilter;

          return matchesSearch && matchesStatus && matchesSize && matchesPayment;
        }).sort((a, b) => {
          let aVal = a[sortField];
          let bVal = b[sortField];
          if (typeof aVal === 'string') {
            return sortDirection === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
          }
          return sortDirection === 'asc' ? (aVal - bVal) : (bVal - aVal);
        });
      }, [data, searchQuery, statusFilter, sizeFilter, paymentFilter, sortField, sortDirection]);

      if (loading) {
        return (
          <div class="min-h-screen bg-[#060c18] flex flex-col items-center justify-center p-6 text-slate-100">
            <div class="relative flex items-center justify-center mb-6">
              <div class="w-16 h-16 rounded-full border-4 border-[#0066ff]/20 border-t-[#0066ff] animate-spin"></div>
              <Activity class="w-6 h-6 text-[#00d2a0] absolute" />
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white mb-2">CareGP Financial Dashboard</h1>
            <p class="text-sm text-slate-400">Loading clinic metrics & financial intelligence...</p>
          </div>
        );
      }

      if (error) {
        return (
          <div class="min-h-screen bg-[#060c18] flex items-center justify-center p-6">
            <div class="max-w-md w-full bg-[#0d182b] border border-red-500/30 rounded-xl p-6 text-center">
              <AlertCircle class="w-12 h-12 text-red-400 mx-auto mb-4" />
              <h2 class="text-lg font-bold text-white mb-2">Dashboard Offline</h2>
              <p class="text-sm text-slate-300 mb-6">{error}</p>
              <button 
                onClick={() => fetchData(true)} 
                class="px-5 py-2.5 bg-[#0066ff] hover:bg-blue-600 text-white rounded-lg font-medium text-sm transition-colors inline-flex items-center gap-2"
              >
                <RefreshCw class="w-4 h-4" />
                Retry Connection
              </button>
            </div>
          </div>
        );
      }

      const { summary, clinics } = data;
      const { sizeSegmentation, paymentSegmentation, matrix } = summary;

      // Formatting Helpers
      const fmtCurrency = (val) => new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', maximumFractionDigits: 0 }).format(val || 0);
      const fmtNum = (val) => new Intl.NumberFormat('en-AU').format(val || 0);

      const formulaModalData = selectedFormulaKey ? FORMULAS_CATALOG[selectedFormulaKey] : null;

      return (
        <div class="min-h-screen bg-[#060c18] dark:bg-[#060c18] text-slate-100 flex flex-col">
          
          {/* HEADER NAV */}
          <header class="bg-[#0d182b] border-b border-[#1a2e4f] sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand & Identity */}
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#0066ff] to-[#00d2a0] flex items-center justify-center shadow-lg shadow-[#0066ff]/20">
                  <span class="text-white font-extrabold text-xl tracking-tight">GP</span>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-black text-xl tracking-tight text-white">Care<span class="text-[#0066ff]">GP</span></span>
                    <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-[#0066ff]/15 text-[#0066ff] border border-[#0066ff]/30">
                      Financial Executive
                    </span>
                  </div>
                  <p class="text-xs text-slate-400 font-medium">AU Medical AI • Operating & Financial Intelligence</p>
                </div>
              </div>

              {/* Compliance Badges & Controls */}
              <div class="flex items-center gap-3">
                <div class="hidden lg:flex items-center gap-2 bg-[#14233c] border border-[#1a2e4f] rounded-lg px-3 py-1.5 text-xs text-slate-300">
                  <ShieldCheck class="w-4 h-4 text-[#00d2a0]" />
                  <span>RACGP & AHPRA Compliant</span>
                  <span class="text-slate-600">•</span>
                  <span class="text-slate-400">Sydney Local DC</span>
                </div>

                <button 
                  onClick={() => fetchData(true)}
                  disabled={refreshing}
                  class="p-2 bg-[#14233c] hover:bg-[#1a2e4f] border border-[#1a2e4f] rounded-lg text-slate-300 transition-colors"
                  title="Refresh Sheet Data"
                >
                  <RefreshCw class={`w-4 h-4 ${refreshing ? 'animate-spin text-[#0066ff]' : ''}`} />
                </button>

                <button 
                  onClick={toggleTheme}
                  class="p-2 bg-[#14233c] hover:bg-[#1a2e4f] border border-[#1a2e4f] rounded-lg text-slate-300 transition-colors"
                  title="Toggle Theme"
                >
                  {isDarkMode ? <Sun class="w-4 h-4 text-amber-400" /> : <Moon class="w-4 h-4 text-indigo-400" />}
                </button>
              </div>

            </div>

            {/* TAB NAVIGATION */}
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto gap-2 border-t border-[#1a2e4f]/60 pt-2 pb-2">
              <button
                onClick={() => setActiveTab('summary')}
                class={`px-3.5 py-2 rounded-lg font-semibold text-xs tracking-wide transition-all flex items-center gap-1.5 whitespace-nowrap ${
                  activeTab === 'summary'
                    ? 'bg-[#0066ff] text-white shadow-md shadow-[#0066ff]/30'
                    : 'text-slate-400 hover:text-white hover:bg-[#14233c]'
                }`}
              >
                <Zap class="w-3.5 h-3.5" />
                1. Executive Summary
              </button>

              <button
                onClick={() => setActiveTab('segmentation')}
                class={`px-3.5 py-2 rounded-lg font-semibold text-xs tracking-wide transition-all flex items-center gap-1.5 whitespace-nowrap ${
                  activeTab === 'segmentation'
                    ? 'bg-[#0066ff] text-white shadow-md shadow-[#0066ff]/30'
                    : 'text-slate-400 hover:text-white hover:bg-[#14233c]'
                }`}
              >
                <Building2 class="w-3.5 h-3.5 text-[#00d2a0]" />
                2. Size & Billing Breakdown
              </button>

              <button
                onClick={() => setActiveTab('saas')}
                class={`px-3.5 py-2 rounded-lg font-semibold text-xs tracking-wide transition-all flex items-center gap-1.5 whitespace-nowrap ${
                  activeTab === 'saas'
                    ? 'bg-[#0066ff] text-white shadow-md shadow-[#0066ff]/30'
                    : 'text-slate-400 hover:text-white hover:bg-[#14233c]'
                }`}
              >
                <BarChart3 class="w-3.5 h-3.5 text-purple-400" />
                3. SaaS & Unit Economics
              </button>

                      </select>
                    </div>
                  </div>

                  {(() => {
                    const c = clinics[auditClinicIndex] || clinics[0];
                    if (!c) return null;

                    const perGpRate = c.paymentSchedule === 'Annual' ? 105 : 125;
                    const agentMult = c.agentCount === 3 ? 2.1 : c.agentCount === 2 ? 1.5 : 1.0;
                    const baseMonthly = c.numGps * perGpRate;
                    const calculatedSub = Math.round(baseMonthly * agentMult);
                    const calculatedArr = calculatedSub * 12;

                    const baselineSec = 180;
                    const secSavedPerDoc = baselineSec - c.timePerDocSec;
                    const calcHoursSaved = Number(((c.uploads * secSavedPerDoc) / 3600).toFixed(1));
                    const calcFinancialValue = Math.round((c.totalHoursSaved || calcHoursSaved) * 120);
                    const calcRoi = calculatedArr > 0 ? (calcFinancialValue / calculatedArr).toFixed(2) : '0.00';

                    return (
                      <div class="space-y-6">
                        
                        {/* Selected Practice Meta Summary */}
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 bg-[#14233c] p-4 rounded-xl border border-[#1a2e4f]">
                          <div>
                            <span class="text-[10px] text-slate-400 uppercase font-semibold">Practice Name</span>
                            <div class="text-sm font-bold text-white truncate">{c.name}</div>
                          </div>
                          <div>
                            <span class="text-[10px] text-slate-400 uppercase font-semibold">Size Tier & GPs</span>
                            <div class="text-sm font-bold text-[#0066ff]">{c.numGps} GPs ({c.clinicSizeKey})</div>

                            <span class="text-[10px] text-slate-400 uppercase font-semibold">Billing Schedule</span>
                            <div class="text-sm font-bold text-[#00d2a0]">{c.paymentSchedule} Plan</div>
                          </div>
                          <div>
                            <span class="text-[10px] text-slate-400 uppercase font-semibold">Active Agents</span>
                            <div class="text-sm font-bold text-purple-400">{c.agentCount} Agents ({agentMult}x)</div>
                          </div>
                        </div>

                        {/* STEP BY STEP MATHEMATICAL DERIVATION */}

                          {/* Step 1: Subscription & ARR */}
                          <div class="bg-[#14233c] p-5 rounded-xl border border-[#1a2e4f] space-y-3">
                            <div class="flex items-center gap-2 text-xs font-bold text-[#0066ff]">
                              <span class="w-5 h-5 rounded-full bg-[#0066ff]/20 text-[#0066ff] flex items-center justify-center text-[10px]">1</span>
                              <span>Monthly Sub & ARR Derivation</span>
                            </div>
                            <div class="font-mono text-xs bg-[#060c18] p-3 rounded border border-[#1a2e4f] space-y-1.5 text-slate-300">
                              <div><span class="text-slate-500">// Base Seats:</span> {c.numGps} GPs × ${perGpRate}/mo = ${baseMonthly}</div>
                              <div><span class="text-slate-500">// Agent Mult:</span> ${baseMonthly} × {agentMult}x = ${calculatedSub}/mo</div>
                              <div class="text-[#00d2a0] font-bold">// Annual ARR: ${calculatedSub} × 12 = {fmtCurrency(calculatedArr)}</div>
                            </div>
                            <p class="text-[11px] text-slate-400">Match Check: Actual Sheet ARR is <strong>{fmtCurrency(c.arr)}</strong></p>
                          </div>

                          {/* Step 2: Hours Saved */}
                          <div class="bg-[#14233c] p-5 rounded-xl border border-[#1a2e4f] space-y-3">
                            <div class="flex items-center gap-2 text-xs font-bold text-[#00d2a0]">
                              <span class="w-5 h-5 rounded-full bg-[#00d2a0]/20 text-[#00d2a0] flex items-center justify-center text-[10px]">2</span>
                              <span>Hours Saved Derivation</span>
                            </div>
                            <div class="font-mono text-xs bg-[#060c18] p-3 rounded border border-[#1a2e4f] space-y-1.5 text-slate-300">
                              <div><span class="text-slate-500">// Sec Saved/Doc:</span> 180s - {c.timePerDocSec}s = {secSavedPerDoc}s</div>
                              <div><span class="text-slate-500">// Total Uploads:</span> {fmtNum(c.uploads)} docs</div>
                              <div class="text-[#00d2a0] font-bold">// Hours Saved: ({fmtNum(c.uploads)} × {secSavedPerDoc}s) ÷ 3600 = {c.totalHoursSaved} hrs</div>
                            </div>
                            <p class="text-[11px] text-slate-400">Match Check: Sheet Col R is <strong>{fmtNum(c.totalHoursSaved)} hrs</strong></p>
                          </div>

                          {/* Step 3: Financial Savings & ROI */}
                          <div class="bg-[#14233c] p-5 rounded-xl border border-[#1a2e4f] space-y-3">
                            <div class="flex items-center gap-2 text-xs font-bold text-purple-400">
                              <span class="w-5 h-5 rounded-full bg-purple-500/20 text-purple-400 flex items-center justify-center text-[10px]">3</span>
                              <span>Value & ROI Multiplier</span>

                              <div><span class="text-slate-500">// Value Saved:</span> {c.totalHoursSaved} hrs × $120/hr = {fmtCurrency(c.financialSavings)}</div>
                              <div class="text-[#00d2a0] font-bold">// ROI Multiplier: {fmtCurrency(c.financialSavings)} ÷ {fmtCurrency(calculatedArr)} = {calcRoi}x</div>
                            </div>
                            <p class="text-[11px] text-slate-400">Match Check: Sheet Col X ROI is <strong>{c.roiMultiplier}x</strong></p>
                          </div>

                        </div>

                      </div>
                    );
                  })()}

                    <table class="w-full text-left text-xs text-slate-300">
                      <thead class="bg-[#14233c] text-slate-400 uppercase font-bold text-[11px] border-b border-[#1a2e4f]">
                        <tr>
                          <th class="p-3.5">Metric Name</th>
                          <th class="p-3.5">Category</th>
                          <th class="p-3.5">Mathematical Equation</th>
                          <th class="p-3.5">Google Sheet Source Column</th>
                          <th class="p-3.5 text-center">Inspect</th>
                        </tr>

                              <button 
                                onClick={() => setSelectedFormulaKey(f.id)}
                                class="px-2.5 py-1 bg-[#14233c] hover:bg-[#0066ff] text-slate-300 hover:text-white rounded border border-[#1a2e4f] text-[11px] font-semibold transition-colors inline-flex items-center gap-1"

                    <h2 class="text-lg font-bold text-white flex items-center gap-2">

                    </h2>
                    <p class="text-xs text-slate-400">Maps raw Google Sheet columns to internal dashboard variables and formula inputs</p>

                    <div class="bg-[#14233c] p-3.5 rounded-lg border border-[#1a2e4f]">
                      <div class="font-mono text-[#0066ff] font-bold">Col A (0): Clinic Name</div>
                      <div class="text-slate-400 mt-1">Unique medical practice identifier</div>
                    </div>
                    <div class="bg-[#14233c] p-3.5 rounded-lg border border-[#1a2e4f]">
                      <div class="font-mono text-[#0066ff] font-bold">Col C (2): Status</div>
                      <div class="text-slate-400 mt-1">Closed, Pilot, Warm Pilot, Dropped Off</div>
                    </div>
                    <div class="bg-[#14233c] p-3.5 rounded-lg border border-[#1a2e4f]">
                      <div class="font-mono text-[#0066ff] font-bold">Col E (4): Uploads</div>
                      <div class="text-slate-400 mt-1">Total documents ingested</div>
                    </div>
                    <div class="bg-[#14233c] p-3.5 rounded-lg border border-[#1a2e4f]">
                      <div class="font-mono text-[#0066ff] font-bold">Col O (14): numGps</div>
                      <div class="text-slate-400 mt-1">Number of active doctors</div>
                    </div>
                    <div class="bg-[#14233c] p-3.5 rounded-lg border border-[#1a2e4f]">
                      <div class="font-mono text-[#0066ff] font-bold">Col P (15): timePerDocSec</div>
                      <div class="text-slate-400 mt-1">Seconds spent per document (vs 180s baseline)</div>
                    </div>
                    <div class="bg-[#14233c] p-3.5 rounded-lg border border-[#1a2e4f]">
                      <div class="font-mono text-[#0066ff] font-bold">Col R (17): totalHoursSaved</div>
                      <div class="text-slate-400 mt-1">Calculated hours saved</div>
                    </div>
                    <div class="bg-[#14233c] p-3.5 rounded-lg border border-[#1a2e4f]">
                      <div class="font-mono text-[#0066ff] font-bold">Col S (18): financialSavings</div>

                    </div>
                    <div class="bg-[#14233c] p-3.5 rounded-lg border border-[#1a2e4f]">
                      <div class="font-mono text-[#0066ff] font-bold">Col X (23): roiMultiplier</div>
                      <div class="text-slate-400 mt-1">Financial savings ÷ Sub cost</div>
                    </div>
                  </div>
                </div>

              </div>
            )}

          {/* FORMULA MODAL OVERLAY */}

                      ƒ

                      <span class="text-[10px] uppercase font-bold text-[#00d2a0] tracking-wider">{formulaModalData.category}</span>

                  <button 
                    onClick={() => setSelectedFormulaKey(null)}
                    class="p-1.5 rounded-lg bg-[#14233c] hover:bg-[#1a2e4f] text-slate-400 hover:text-white transition-colors"
                  >
                    <X class="w-5 h-5" />
                  </button>
                </div>

                {/* Modal Body */}
                <div class="space-y-5">
                  
                  {/* Equation Box */}
                  <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-2">Mathematical Formulation</label>
                    <div class="p-4 bg-[#060c18] border border-[#1a2e4f] rounded-xl font-mono text-sm text-[#00d2a0] font-bold">
                      {formulaModalData.equation}
                    </div>
                  </div>

                  {/* Explanation */}
                  <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-1">Methodology & Logic</label>
                    <p class="text-xs text-slate-300 leading-relaxed bg-[#14233c] p-3.5 rounded-lg border border-[#1a2e4f]">
                      {formulaModalData.explanation}
                    </p>
                  </div>

                  {/* Inputs Table */}
                  <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-2">Input Variables & Parameters</label>
                    <div class="space-y-1.5">
                      {formulaModalData.inputs.map((inp, idx) => (
                        <div key={idx} class="flex justify-between items-center bg-[#14233c] px-3.5 py-2 rounded-lg text-xs border border-[#1a2e4f]">
                          <span class="font-semibold text-white">{inp.name}:</span>
                          <span class="text-slate-300 font-mono">{inp.value}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Worked Concrete Example */}
                  <div>
                    <label class="text-xs font-semibold text-slate-400 block mb-1">Worked Sample Calculation</label>
                    <div class="p-3.5 bg-[#060c18] border border-[#0066ff]/30 rounded-xl font-mono text-xs text-slate-200">
                      {formulaModalData.example}
                    </div>
                  </div>

                  {/* Source mapping */}
                  <div class="text-[11px] text-slate-400 flex items-center justify-between pt-2 border-t border-[#1a2e4f]">
                    <span>Source: <strong class="text-white">{formulaModalData.sheetSource}</strong></span>
                    <button 
                      onClick={() => {
                        setSelectedFormulaKey(null);
                        setActiveTab('formulas');
                      }}
                      class="text-[#0066ff] hover:underline font-semibold flex items-center gap-1"
                    >
                      Audit Handbook <ArrowRight class="w-3 h-3" />
                    </button>
                  </div>

                </div>

              </div>
            </div>
          )}

          {/* SLIDE-OVER DETAIL DRAWER FOR CLINIC */}
          {selectedClinic && (
            <div class="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm">
              <div class="w-full max-w-lg bg-[#0d182b] border-l border-[#1a2e4f] h-full p-6 overflow-y-auto flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between pb-4 border-b border-[#1a2e4f] mb-6">
                    <div>
                      <h3 class="text-lg font-bold text-white">{selectedClinic.name}</h3>
                      <p class="text-xs text-slate-400">{selectedClinic.clinicSizeCategory} • {selectedClinic.paymentSchedule} Plan</p>
                    </div>
                    <button onClick={() => setSelectedClinic(null)} class="p-1.5 rounded-lg bg-[#14233c] hover:bg-[#1a2e4f] text-slate-400 hover:text-white">
                      <X class="w-5 h-5" />
                    </button>
                  </div>

                  <div class="space-y-4 text-xs">
                    <div class="bg-[#14233c] p-4 rounded-lg border border-[#1a2e4f] space-y-2">
                      <div class="flex justify-between">
                        <span class="text-slate-400">Status:</span>
                        <span class="font-bold text-[#00d2a0]">{selectedClinic.status}</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-400">GP Seats:</span>

                      <div class="flex justify-between">
                        <span class="text-slate-400">Payment Schedule:</span>

                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-400">Annual Contract Value (ARR):</span>
                        <span class="font-bold text-[#00d2a0] numeric">{fmtCurrency(selectedClinic.arr)}</span>
                      </div>
                    </div>

                    <div class="bg-[#14233c] p-4 rounded-lg border border-[#1a2e4f] space-y-2">
                      <div class="flex justify-between">
                        <span class="text-slate-400">Hours Saved:</span>
                        <span class="font-bold text-white numeric">{fmtNum(selectedClinic.totalHoursSaved)} hrs</span>
                      </div>
                      <div class="flex justify-between">
