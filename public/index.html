<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareGP — Financial & Operational Intelligence Dashboard</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            dark: {
              canvas: '#0b0f19',
              surface: '#111827',
              elevated: '#1f2937',
              border: '#1f2937',
              borderStrong: '#374151'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Importmap for React 18, Lucide Icons, Recharts, Framer Motion -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom",
      "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
    }
  }
  </script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Custom scrollbars & tabular numbers */
    .numeric, table, [data-numeric="true"] {
      font-variant-numeric: tabular-nums;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      TrendingUp, DollarSign, Clock, Building2, FileText, CheckCircle2, 
      AlertCircle, Search, RefreshCw, Download, ArrowUpRight, ChevronDown, 
      ChevronUp, Filter, Users, Cpu, ShieldCheck, Zap, Activity, Info, 
      Calculator, ArrowRight, X, ExternalLink, Calendar, HelpCircle
    } from 'lucide-react';
    import { 
      ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, 
      CartesianGrid, ScatterChart, Scatter, Cell, PieChart, Pie, Legend,
      AreaChart, Area
    } from 'recharts';

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [gpSizeFilter, setGpSizeFilter] = useState('All');
      const [activeTab, setActiveTab] = useState('overview'); // overview, clinics, calculator, cohorts
      const [selectedClinic, setSelectedClinic] = useState(null);
      const [sortField, setSortField] = useState('financialSavings');
      const [sortDirection, setSortDir] = useState('desc');
      const [page, setPage] = useState(1);
      const pageSize = 20;

      // ROI Calculator States
      const [calcGps, setCalcGps] = useState(15);
      const [calcDocsPerGp, setCalcDocsPerGp] = useState(25);
      const [calcGpRate, setCalcGpRate] = useState(150); // $150/hr
      const [calcTimeSavedPerDocSec, setCalcTimeSavedPerDocSec] = useState(20); // 20s per doc

      // Keyboard shortcut listener
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === '/' && document.activeElement?.tagName !== 'INPUT') {
            e.preventDefault();
            document.getElementById('clinic-search-input')?.focus();
          }
          if (e.key === 'Escape') {
            setSelectedClinic(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const fetchData = async (force = false) => {
        if (force) setRefreshing(true);
        else setLoading(true);
        setError(null);

        try {
          const url = force ? './api/dashboard?refresh=true' : './api/dashboard';
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          setData(json);
        } catch (err) {
          console.error(err);
          setError(err.message || 'Failed to load dashboard data');
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Filtered clinics calculation
      const filteredClinics = useMemo(() => {
        if (!data?.clinics) return [];
        return data.clinics.filter(c => {
          const matchesSearch = searchQuery === '' || 
            c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.comments.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.status.toLowerCase().includes(searchQuery.toLowerCase());

          const matchesStatus = statusFilter === 'All' || c.status === statusFilter;
          
          let matchesSize = true;
          if (gpSizeFilter === 'small') matchesSize = c.numGps >= 1 && c.numGps <= 5;
          else if (gpSizeFilter === 'medium') matchesSize = c.numGps > 5 && c.numGps <= 15;
          else if (gpSizeFilter === 'large') matchesSize = c.numGps > 15;

          return matchesSearch && matchesStatus && matchesSize;
        });
      }, [data, searchQuery, statusFilter, gpSizeFilter]);

      // Sorted clinics
      const sortedClinics = useMemo(() => {
        return [...filteredClinics].sort((a, b) => {
          let valA = a[sortField];
          let valB = b[sortField];
          if (typeof valA === 'string') {
            valA = valA.toLowerCase();
            valB = (valB || '').toLowerCase();
          }
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filteredClinics, sortField, sortDirection]);

      // Paginated clinics
      const paginatedClinics = useMemo(() => {
        const start = (page - 1) * pageSize;
        return sortedClinics.slice(start, start + pageSize);
      }, [sortedClinics, page]);

      const totalPages = Math.ceil(sortedClinics.length / pageSize) || 1;

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDir(sortDirection === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDir('desc');
        }
      };

      // Export CSV
      const exportCSV = () => {
        if (!filteredClinics.length) return;
        const headers = ["Clinic Name", "Status", "Number of GPs", "Allocations", "Uploads", "Uploader %", "Avg Accuracy %", "Hours Saved", "Financial Savings ($)"];
        const rows = filteredClinics.map(c => [
          `"${c.name.replace(/"/g, '""')}"`,
          c.status,
          c.numGps,
          c.allocations,
          c.uploads,
          `${c.uploaderPct.toFixed(1)}%`,
          `${c.avgAccuracy.toFixed(1)}%`,
          c.totalHoursSaved.toFixed(1),
          c.financialSavings.toFixed(2)
        ]);

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `CareGP_Financial_Export_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // ROI Model Calculations
      const roiCalcResults = useMemo(() => {
        // Daily seconds saved = GPs * docsPerGP * timeSavedPerDocSec
        const dailySecSaved = calcGps * calcDocsPerGp * calcTimeSavedPerDocSec;
        const dailyHoursSaved = dailySecSaved / 3600;
        const monthlyHoursSaved = dailyHoursSaved * 22; // ~22 working days
        const annualHoursSaved = monthlyHoursSaved * 12;

        const monthlyGrossDollarSavings = monthlyHoursSaved * calcGpRate;
        const annualGrossDollarSavings = annualHoursSaved * calcGpRate;

        // Estimated CareGP Subscription cost per GP per month (e.g. $150/GP/mo)
        const estCareGpSubscriptionMonthly = calcGps * 120;
        const annualCareGpCost = estCareGpSubscriptionMonthly * 12;

        const netAnnualSavings = annualGrossDollarSavings - annualCareGpCost;
        const roiMultiplier = annualCareGpCost > 0 ? (annualGrossDollarSavings / annualCareGpCost) : 0;

        return {
          dailyHoursSaved: dailyHoursSaved.toFixed(1),
          monthlyHoursSaved: monthlyHoursSaved.toFixed(0),
          annualHoursSaved: annualHoursSaved.toFixed(0),
          monthlyGrossDollarSavings: monthlyGrossDollarSavings.toFixed(0),
          annualGrossDollarSavings: annualGrossDollarSavings.toFixed(0),
          annualCareGpCost: annualCareGpCost.toFixed(0),
          netAnnualSavings: netAnnualSavings.toFixed(0),
          roiMultiplier: roiMultiplier.toFixed(1)
        };
      }, [calcGps, calcDocsPerGp, calcGpRate, calcTimeSavedPerDocSec]);

      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen bg-slate-950 text-slate-300 space-y-4">
            <div class="relative w-16 h-16">
              <div class="absolute inset-0 rounded-full border-4 border-slate-800"></div>
              <div class="absolute inset-0 rounded-full border-4 border-emerald-500 border-t-transparent animate-spin"></div>
            </div>
            <p class="text-sm font-medium tracking-wide text-slate-400 animate-pulse">Syncing CareGP Financial Data from Google Sheets...</p>
          </div>
        );
      }

      if (error) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen bg-slate-950 p-6">
            <div class="bg-slate-900 border border-red-500/30 rounded-xl p-6 max-w-md w-full text-center space-y-4 shadow-2xl">
              <div class="w-12 h-12 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mx-auto">
                <AlertCircle size={24} />
              </div>
              <h2 class="text-lg font-bold text-slate-100">Data Synchronization Failed</h2>
              <p class="text-sm text-slate-400">{error}</p>
              <button 
                onClick={() => fetchData(true)}
                class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm transition-colors"
              >
                <RefreshCw size={16} /> Retry Sync
              </button>
            </div>
          </div>
        );
      }

      const summary = data.summary;
      const meta = data.meta;

      // Status pill color map
      const getStatusBadge = (status) => {
        switch(status) {
          case 'Closed':
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Closed</span>;
          case 'Pilot':
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20"><span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>Pilot</span>;
          case 'Warm Pilot':
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Warm Pilot</span>;
          case 'Dropped Off':
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20"><span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>Dropped Off</span>;
          default:
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">{status}</span>;
        }
      };

      // Top 10 Clinics Chart Data
      const topSavingsChartData = [...data.clinics]
        .sort((a,b) => b.financialSavings - a.financialSavings)
        .slice(0, 10)
        .map(c => ({
          name: c.name.length > 18 ? c.name.slice(0, 16) + '...' : c.name,
          fullName: c.name,
          savings: Math.round(c.financialSavings),
          hours: Math.round(c.totalHoursSaved)
        }));

      // Accuracy Level Data
      const accuracyChartData = [
        { level: 'Layer 1 (OCR/AI)', accuracy: 91.2 },
        { level: 'Layer 2 (Entities)', accuracy: 88.5 },
        { level: 'Layer 3 (Medical Coding)', accuracy: 92.1 },
        { level: 'Layer 4 (Validation)', accuracy: 78.4 },
      ];

      // Status Pie Chart Data
      const statusPieData = [
        { name: 'Closed', value: summary.closedCount, color: '#10b981' },
        { name: 'Pilot', value: summary.pilotCount, color: '#3b82f6' },
        { name: 'Warm Pilot', value: summary.warmPilotCount, color: '#f59e0b' },
        { name: 'Dropped Off', value: summary.droppedOffCount, color: '#f43f5e' },
      ].filter(d => d.value > 0);

      return (
        <div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* TOPBAR */}
          <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-emerald-500/20">
                <Activity size={20} />
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-base font-bold tracking-tight text-slate-100">CareGP</h1>
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                    Financial Intelligence
                  </span>
                </div>
                <p class="text-xs text-slate-400">Live ROI & Operations Analytics Dashboard</p>
              </div>
            </div>

            <div class="flex items-center gap-3 flex-wrap">
              {/* Search Bar */}
              <div class="relative w-64 md:w-80">
                <Search size={15} class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                <input 
                  id="clinic-search-input"
                  type="text"
                  placeholder="Search clinic or comments... (/)"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  class="w-full h-8 pl-9 pr-8 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                    <X size={13} />
                  </button>
                )}
              </div>

              {/* Sync Status Badge */}
              <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-slate-400">
                <span class={`w-2 h-2 rounded-full ${meta.isCached ? 'bg-amber-400' : 'bg-emerald-400'} animate-pulse`}></span>
                <span>{meta.isCached ? 'Cached' : 'Google Sheets Live'}</span>
                <span class="text-slate-600">|</span>
                <span class="text-[11px] text-slate-500">{meta.topLastUpdated}</span>
              </div>

              {/* Action Buttons */}
              <button 
                onClick={() => fetchData(true)}
                disabled={refreshing}
                class="h-8 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 flex items-center gap-1.5 transition-all disabled:opacity-50"
                title="Force refresh Google Sheet CSV"
              >
                <RefreshCw size={13} class={refreshing ? 'animate-spin' : ''} />
                <span>Refresh</span>
              </button>

              <button 
                onClick={exportCSV}
                class="h-8 px-3 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium flex items-center gap-1.5 transition-all shadow-md shadow-emerald-600/20"
              >
                <Download size={13} />
                <span>Export CSV</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTAINER */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 space-y-6">

            {/* EXECUTIVE SUMMARY KPI CARDS */}
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
              
              {/* CARD 1: Financial ROI */}
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 relative overflow-hidden group hover:border-slate-700 transition-all">
                <div class="absolute -right-4 -bottom-4 w-24 h-24 bg-emerald-500/5 rounded-full blur-xl group-hover:bg-emerald-500/10 transition-all"></div>
                <div class="flex items-center justify-between text-slate-400 text-xs font-medium uppercase tracking-wider mb-2">
                  <span>Total Financial ROI</span>
                  <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                    <DollarSign size={18} />
                  </div>
                </div>
                <div class="text-2xl lg:text-3xl font-bold text-slate-100 numeric tracking-tight">
                  ${Math.round(summary.totalFinancialSavings).toLocaleString()}
                </div>
                <div class="mt-2 flex items-center gap-2 text-xs">
                  <span class="text-emerald-400 font-semibold flex items-center gap-0.5">
                    <ArrowUpRight size={14} /> +${Math.round(summary.totalFinancialSavings / (summary.closedCount || 1)).toLocaleString()}
                  </span>
                  <span class="text-slate-500">avg per closed clinic</span>
                </div>
              </div>

              {/* CARD 2: Hours Saved */}
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 relative overflow-hidden group hover:border-slate-700 transition-all">
                <div class="flex items-center justify-between text-slate-400 text-xs font-medium uppercase tracking-wider mb-2">
                  <span>Total Hours Reclaimed</span>
                  <div class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center">
                    <Clock size={18} />
                  </div>
                </div>
                <div class="text-2xl lg:text-3xl font-bold text-slate-100 numeric tracking-tight">
                  {Math.round(summary.totalHoursSaved).toLocaleString()} <span class="text-sm font-normal text-slate-400">hrs</span>
                </div>
                <div class="mt-2 flex items-center gap-2 text-xs text-slate-400">
                  <span class="text-blue-400 font-semibold">{summary.totalGps} GPs</span>
                  <span class="text-slate-500">supported across network</span>
                </div>
              </div>

              {/* CARD 3: Document Processing Volume */}
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 relative overflow-hidden group hover:border-slate-700 transition-all">
                <div class="flex items-center justify-between text-slate-400 text-xs font-medium uppercase tracking-wider mb-2">
                  <span>Docs Uploaded / Allocated</span>
                  <div class="w-8 h-8 rounded-lg bg-teal-500/10 text-teal-400 flex items-center justify-center">
                    <FileText size={18} />
                  </div>
                </div>
                <div class="text-2xl lg:text-3xl font-bold text-slate-100 numeric tracking-tight">
                  {(summary.totalUploads / 1000).toFixed(1)}k <span class="text-sm font-normal text-slate-400">/ {(summary.totalAllocations / 1000).toFixed(1)}k</span>
                </div>
                <div class="mt-2 flex items-center gap-2 text-xs">
                  <span class="text-teal-400 font-semibold">{summary.avgUploaderPct.toFixed(1)}%</span>
                  <span class="text-slate-500">avg uploader adoption rate</span>
                </div>
              </div>

              {/* CARD 4: Network & Accuracy Benchmark */}
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 relative overflow-hidden group hover:border-slate-700 transition-all">
                <div class="flex items-center justify-between text-slate-400 text-xs font-medium uppercase tracking-wider mb-2">
                  <span>Clinics & Accuracy</span>
                  <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
                    <Building2 size={18} />
                  </div>
                </div>
                <div class="text-2xl lg:text-3xl font-bold text-slate-100 numeric tracking-tight">
                  {summary.closedCount} <span class="text-sm font-normal text-slate-400">/ {summary.totalClinics} clinics</span>
                </div>
                <div class="mt-2 flex items-center gap-2 text-xs">
                  <span class="text-indigo-400 font-semibold">{summary.avgAccuracyOverall.toFixed(1)}%</span>
                  <span class="text-slate-500">avg L1-L4 AI accuracy</span>
                </div>
              </div>

            </div>

            {/* DASHBOARD NAVIGATION TABS */}
            <div class="border-b border-slate-800 flex items-center justify-between overflow-x-auto gap-4">
              <div class="flex items-center gap-2">
                <button 
                  onClick={() => setActiveTab('overview')}
                  class={`px-4 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-2 whitespace-nowrap ${
                    activeTab === 'overview' 
                      ? 'border-emerald-500 text-emerald-400 bg-slate-900/50' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Activity size={14} /> Overview & Analytics
                </button>

                <button 
                  onClick={() => setActiveTab('clinics')}
                  class={`px-4 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-2 whitespace-nowrap ${
                    activeTab === 'clinics' 
                      ? 'border-emerald-500 text-emerald-400 bg-slate-900/50' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Building2 size={14} /> Clinics Directory ({filteredClinics.length})
                </button>

                <button 
                  onClick={() => setActiveTab('calculator')}
                  class={`px-4 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-2 whitespace-nowrap ${
                    activeTab === 'calculator' 
                      ? 'border-emerald-500 text-emerald-400 bg-slate-900/50' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Calculator size={14} /> CareGP ROI Modeler
                </button>

                <button 
                  onClick={() => setActiveTab('cohorts')}
                  class={`px-4 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-2 whitespace-nowrap ${
                    activeTab === 'cohorts' 
                      ? 'border-emerald-500 text-emerald-400 bg-slate-900/50' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >

                    </div>

                    {/* Standard Pilot Box */}
                    <div class="bg-slate-950 p-4 rounded-lg border border-blue-500/30">
                      <div class="flex items-center justify-between text-xs text-blue-400 font-semibold mb-2">
                        <span>Active Pilot Cohort</span>
                        <span class="px-2 py-0.5 rounded bg-blue-500/10 text-blue-400">{summary.pilotCount} Clinics</span>
                      </div>
                      <p class="text-xs text-slate-400">Clinics currently testing CareGP AI document workflow in trial phase.</p>
                      <div class="mt-3 text-xs font-bold text-slate-200">
                        Top Pilots: {data.clinics.filter(c => c.status === 'Pilot').slice(0, 3).map(c => c.name).join(', ') || 'None'}
                      </div>
                    </div>

                    {/* Closed Deals Box */}
                    <div class="bg-slate-950 p-4 rounded-lg border border-emerald-500/30">
                      <div class="flex items-center justify-between text-xs text-emerald-400 font-semibold mb-2">
                        <span>Closed / Converted</span>
                        <span class="px-2 py-0.5 rounded bg-emerald-500/10 text-emerald-400">{summary.closedCount} Clinics</span>
                      </div>
                      <p class="text-xs text-slate-400">Fully onboarded paying practices generating verified financial savings.</p>
                      <div class="mt-3 text-xs font-bold text-emerald-400">
                        Total ROI: ${Math.round(summary.totalFinancialSavings).toLocaleString()}
                      </div>
                    </div>
                  </div>
                </div>

                {/* Detailed Pilot Clinics List */}
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-5">
                  <h4 class="text-xs font-bold text-slate-300 uppercase tracking-wider mb-3">Active Pilots & Warm Pilots Needing Engagement</h4>
                  <div class="space-y-2">
                    {data.clinics.filter(c => c.status === 'Pilot' || c.status === 'Warm Pilot').slice(0, 10).map(c => (
                      <div key={c.id} onClick={() => setSelectedClinic(c)} class="p-3 bg-slate-950 hover:bg-slate-800/80 rounded-lg border border-slate-800 flex items-center justify-between cursor-pointer transition-colors">
                        <div>
                          <div class="text-xs font-bold text-slate-200 flex items-center gap-2">
                            {c.name}
                            {getStatusBadge(c.status)}
                          </div>
                          <div class="text-[11px] text-slate-500 mt-0.5">
                            {c.numGps} GPs • Launch: {c.pilotStartDate || 'N/A'} • {c.daysElapsed} days elapsed
                          </div>
                        </div>
                        <div class="text-right">
                          <div class="text-xs font-semibold text-slate-300">
                            {c.uploaderPct > 0 ? `${c.uploaderPct.toFixed(1)}% Uploader` : 'Pending Setup'}
                          </div>
                          <div class="text-[11px] text-emerald-400 font-medium">
                            {c.financialSavings > 0 ? `$${Math.round(c.financialSavings).toLocaleString()} saved` : '0 ROI yet'}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* CLINIC DETAIL MODAL */}
          {selectedClinic && (
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 space-y-6">
                
                {/* Header */}
                <div class="flex items-start justify-between border-b border-slate-800 pb-4">
                  <div>
                    <div class="flex items-center gap-2">
                      <h3 class="text-lg font-bold text-slate-100">{selectedClinic.name}</h3>
                      {getStatusBadge(selectedClinic.status)}
                    </div>
                    {selectedClinic.comments && (
                      <p class="text-xs text-amber-400 mt-1 bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20 inline-block">
                        Note: {selectedClinic.comments}
                      </p>
                    )}
                  </div>

                  <button onClick={() => setSelectedClinic(null)} class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-200">
                    <X size={18} />
                  </button>
                </div>

                {/* Stats Grid */}
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                  <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-400">Total Financial Savings</span>
                    <div class="text-lg font-bold text-emerald-400 numeric mt-1">
                      ${Math.round(selectedClinic.financialSavings).toLocaleString()}
                    </div>
                  </div>

                  <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-400">Hours Reclaimed</span>
                    <div class="text-lg font-bold text-slate-100 numeric mt-1">
                      {Math.round(selectedClinic.totalHoursSaved)} hrs
                    </div>
                  </div>

                  <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-400">General Practitioners</span>
                    <div class="text-lg font-bold text-slate-100 numeric mt-1">
                      {selectedClinic.numGps || 'N/A'} GPs
                    </div>
                  </div>

                  <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-400">Adoption Uploader %</span>
                    <div class="text-lg font-bold text-teal-400 numeric mt-1">
                      {selectedClinic.uploaderPct.toFixed(1)}%
                    </div>
                  </div>
                </div>

                {/* Accuracy Layers */}
                <div class="space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300">Accuracy & Verification Levels</h4>
                  
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                      <div class="text-slate-400 text-[10px]">Layer 1 (OCR)</div>
                      <div class="font-bold text-slate-200 mt-0.5">{selectedClinic.accuracyL1.toFixed(1)}%</div>
                    </div>
                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                      <div class="text-slate-400 text-[10px]">Layer 2 (Entities)</div>
                      <div class="font-bold text-slate-200 mt-0.5">{selectedClinic.accuracyL2.toFixed(1)}%</div>
                    </div>
                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                      <div class="text-slate-400 text-[10px]">Layer 3 (Coding)</div>
                      <div class="font-bold text-slate-200 mt-0.5">{selectedClinic.accuracyL3.toFixed(1)}%</div>
                    </div>
                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                      <div class="text-slate-400 text-[10px]">Layer 4 (Safety)</div>
                      <div class="font-bold text-slate-200 mt-0.5">{selectedClinic.accuracyL4.toFixed(1)}%</div>
                    </div>
                  </div>
                </div>

                {/* Operations Info */}
                <div class="grid grid-cols-2 gap-3 text-xs text-slate-300 bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <div>
                    <span class="text-slate-500">Document Allocations:</span> <strong class="text-slate-200">{selectedClinic.allocations.toLocaleString()}</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Document Uploads:</span> <strong class="text-slate-200">{selectedClinic.uploads.toLocaleString()}</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Pilot Launch Date:</span> <strong class="text-slate-200">{selectedClinic.pilotStartDate || 'N/A'}</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Days Elapsed:</span> <strong class="text-slate-200">{selectedClinic.daysElapsed} days</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Time Saved / Doc:</span> <strong class="text-emerald-400">{selectedClinic.timePerDocSec.toFixed(1)} seconds</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">ROI Multiplier:</span> <strong class="text-emerald-400">{selectedClinic.roiMultiplier > 0 ? `${selectedClinic.roiMultiplier.toFixed(1)}x` : 'N/A'}</strong>
                  </div>
                </div>

                {/* Footer Action */}
                <div class="flex justify-end pt-2">
                  <button onClick={() => setSelectedClinic(null)} class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700">
                    Close Details
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer class="border-t border-slate-800 py-4 px-4 text-center text-xs text-slate-500">
            CareGP Financial & Operational Dashboard • Connected to Google Sheets ({summary.totalClinics} Medical Practices)
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
