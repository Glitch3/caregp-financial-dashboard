<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareGP — Executive Financial & Operational Intelligence</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            carenavy: {
              50: '#f0f6ff',
              100: '#e0edff',
              200: '#c0daff',
              300: '#8ebcff',
              400: '#5293ff',
              500: '#0066ff', // Core CareGP Blue
              600: '#0052db',
              700: '#003eb8',
              800: '#001a35', // CareGP Deep Navy
              900: '#060c18', // Canvas Dark
              950: '#03060d',
            },
            caremint: {
              50: '#e6fff7',
              100: '#b3ffea',
              200: '#80ffd8',
              400: '#00e6ae',
              500: '#00d2a0', // CareGP Mint Green
              600: '#00a880',
              700: '#007e60',
            },
            caredark: {
              canvas: '#060c18',
              surface: '#0d182b',
              elevated: '#14233c',
              border: '#1a2e4f',
              borderStrong: '#26426e'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Importmap for React 18, Lucide Icons, Recharts -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom",
      "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
    }
  }
  </script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    .numeric, table, [data-numeric="true"] {
      font-variant-numeric: tabular-nums;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(6, 12, 24, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(38, 66, 110, 0.8);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 102, 255, 0.8);
    }
  </style>
</head>
<body class="bg-[#060c18] text-slate-100 min-h-screen font-sans antialiased selection:bg-[#0066ff] selection:text-white transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      TrendingUp, DollarSign, Clock, Building2, FileText, CheckCircle2, 
      AlertCircle, Search, RefreshCw, ArrowUpRight, ArrowDownRight,
      ChevronDown, ChevronUp, Filter, Users, Cpu, ShieldCheck, Zap, Activity, Info, 
      Calculator, ArrowRight, X, ExternalLink, Calendar, HelpCircle,
      PieChart as PieIcon, Layers, Target, Scale, Award, Percent, BarChart3,
      Mic, Receipt, Sparkles, AlertTriangle, Moon, Sun, Shield, Check, Crosshair
    } from 'lucide-react';
    import { 
      ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, 
      Cell, PieChart, Pie, Legend
    } from 'recharts';

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);

      // Filters for Directory
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [sizeFilter, setSizeFilter] = useState('All');
      const [paymentFilter, setPaymentFilter] = useState('All');

      // Tabs: 'summary', 'segmentation', 'saas', 'directory', 'calculator'
      const [activeTab, setActiveTab] = useState('summary');
      const [selectedClinic, setSelectedClinic] = useState(null);

      // Sorting
      const [sortField, setSortField] = useState('arr');
      const [sortDirection, setSortDir] = useState('desc');
      const [isDarkMode, setIsDarkMode] = useState(true);

      // Simple Calculator state
      const [calcGps, setCalcGps] = useState(6);
      const [calcSchedule, setCalcSchedule] = useState('Annual');
      const [calcAgents, setCalcAgents] = useState(2); // 1, 2, or 3

      // Theme toggle
      const toggleTheme = () => {
        const nextMode = !isDarkMode;
        setIsDarkMode(nextMode);
        if (nextMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      const fetchData = async (force = false) => {
        if (force) setRefreshing(true);
        else setLoading(true);
        setError(null);

        try {
          const url = force ? './api/dashboard?refresh=true' : './api/dashboard';
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          setData(json);
        } catch (err) {
          console.error(err);
          setError(err.message || 'Failed to fetch dashboard data');
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Filtered clinics
      const filteredClinics = useMemo(() => {
        if (!data?.clinics) return [];
        return data.clinics.filter(c => {
          const matchesSearch = searchQuery === '' || 
            c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.comments.toLowerCase().includes(searchQuery.toLowerCase());

          const matchesStatus = statusFilter === 'All' || c.status === statusFilter;
          const matchesSize = sizeFilter === 'All' || c.clinicSizeKey === sizeFilter;
          const matchesPayment = paymentFilter === 'All' || c.paymentSchedule === paymentFilter;

          return matchesSearch && matchesStatus && matchesSize && matchesPayment;
        }).sort((a, b) => {
          let aVal = a[sortField];
          let bVal = b[sortField];
          if (typeof aVal === 'string') {
            return sortDirection === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
          }
          return sortDirection === 'asc' ? (aVal - bVal) : (bVal - aVal);
        });
      }, [data, searchQuery, statusFilter, sizeFilter, paymentFilter, sortField, sortDirection]);

      if (loading) {
        return (
          <div class="min-h-screen bg-[#060c18] flex flex-col items-center justify-center p-6 text-slate-100">
            <div class="relative flex items-center justify-center mb-6">
              <div class="w-16 h-16 rounded-full border-4 border-[#0066ff]/20 border-t-[#0066ff] animate-spin"></div>
              <Activity class="w-6 h-6 text-[#00d2a0] absolute" />
            </div>
            <h1 class="text-xl font-bold tracking-tight text-white mb-2">CareGP Financial Dashboard</h1>
            <p class="text-sm text-slate-400">Loading clinic metrics & financial intelligence...</p>
          </div>
        );
      }

      if (error) {
        return (
          <div class="min-h-screen bg-[#060c18] flex items-center justify-center p-6">
            <div class="max-w-md w-full bg-[#0d182b] border border-red-500/30 rounded-xl p-6 text-center">
              <AlertCircle class="w-12 h-12 text-red-400 mx-auto mb-4" />
              <h2 class="text-lg font-bold text-white mb-2">Dashboard Offline</h2>
              <p class="text-sm text-slate-300 mb-6">{error}</p>
              <button 
                onClick={() => fetchData(true)} 
                class="px-5 py-2.5 bg-[#0066ff] hover:bg-blue-600 text-white rounded-lg font-medium text-sm transition-colors inline-flex items-center gap-2"
              >
                <RefreshCw class="w-4 h-4" />
                Retry Connection
              </button>
            </div>
          </div>
        );
      }

      const { summary, clinics } = data;
      const { sizeSegmentation, paymentSegmentation, matrix } = summary;

      // Formatting Helpers
      const fmtCurrency = (val) => new Intl.NumberFormat('en-AU', { style: 'currency', currency: 'AUD', maximumFractionDigits: 0 }).format(val || 0);
      const fmtNum = (val) => new Intl.NumberFormat('en-AU').format(val || 0);

      // Recharts Color Theme
      const COLORS = {
        blue: '#0066ff',
        mint: '#00d2a0',
        purple: '#a855f7',
        amber: '#f59e0b',
        navy: '#1a2e4f'
      };

      // Chart Data preparation
      const chartSizeData = [
        { name: 'Small (1-3 GPs)', arr: sizeSegmentation.small.totalArr, clinics: sizeSegmentation.small.count, arpu: sizeSegmentation.small.arpu },
        { name: 'Medium (4-9 GPs)', arr: sizeSegmentation.medium.totalArr, clinics: sizeSegmentation.medium.count, arpu: sizeSegmentation.medium.arpu },
        { name: 'Large (10+ GPs)', arr: sizeSegmentation.large.totalArr, clinics: sizeSegmentation.large.count, arpu: sizeSegmentation.large.arpu },
      ];

      const chartPaymentData = [
        { name: 'Monthly Billing', value: paymentSegmentation.monthly.totalArr, clinics: paymentSegmentation.monthly.count, churn: paymentSegmentation.monthly.logoChurnRate },
        { name: 'Annual Billing', value: paymentSegmentation.annual.totalArr, clinics: paymentSegmentation.annual.count, churn: paymentSegmentation.annual.logoChurnRate },
      ];

      return (
        <div class="min-h-screen bg-[#060c18] dark:bg-[#060c18] text-slate-100 flex flex-col">
          
          {/* HEADER NAV */}
          <header class="bg-[#0d182b] border-b border-[#1a2e4f] sticky top-0 z-40 backdrop-blur-md bg-opacity-95">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand & Identity */}
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#0066ff] to-[#00d2a0] flex items-center justify-center shadow-lg shadow-[#0066ff]/20">
                  <span class="text-white font-extrabold text-xl tracking-tight">GP</span>
                </div>
                <div>
                  <div class="flex items-center gap-2">
                    <span class="font-black text-xl tracking-tight text-white">Care<span class="text-[#0066ff]">GP</span></span>
                    <span class="text-[10px] uppercase font-bold tracking-widest px-2 py-0.5 rounded-full bg-[#0066ff]/15 text-[#0066ff] border border-[#0066ff]/30">
                      Financial Executive
                    </span>
                  </div>
                  <p class="text-xs text-slate-400 font-medium">AU Medical AI • Operating & Financial Intelligence</p>
                </div>
              </div>

              {/* Compliance Badges & Controls */}
              <div class="flex items-center gap-3">
                <div class="hidden lg:flex items-center gap-2 bg-[#14233c] border border-[#1a2e4f] rounded-lg px-3 py-1.5 text-xs text-slate-300">
                  <ShieldCheck class="w-4 h-4 text-[#00d2a0]" />
                  <span>RACGP & AHPRA Compliant</span>
                  <span class="text-slate-600">•</span>
                  <span class="text-slate-400">Sydney Local DC</span>
                </div>

                <button 
                  onClick={() => fetchData(true)}
                  disabled={refreshing}
                  class="p-2 bg-[#14233c] hover:bg-[#1a2e4f] border border-[#1a2e4f] rounded-lg text-slate-300 transition-colors"
                  title="Refresh Sheet Data"
                >
                  <RefreshCw class={`w-4 h-4 ${refreshing ? 'animate-spin text-[#0066ff]' : ''}`} />
                </button>

                <button 
                  onClick={toggleTheme}
                  class="p-2 bg-[#14233c] hover:bg-[#1a2e4f] border border-[#1a2e4f] rounded-lg text-slate-300 transition-colors"
                  title="Toggle Theme"
                >
                  {isDarkMode ? <Sun class="w-4 h-4 text-amber-400" /> : <Moon class="w-4 h-4 text-indigo-400" />}
                </button>
              </div>

            </div>

            {/* TAB NAVIGATION */}
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto gap-2 border-t border-[#1a2e4f]/60 pt-2 pb-2">
              <button
                onClick={() => setActiveTab('summary')}
                class={`px-4 py-2 rounded-lg font-semibold text-xs tracking-wide transition-all flex items-center gap-2 whitespace-nowrap ${
                  activeTab === 'summary'
                    ? 'bg-[#0066ff] text-white shadow-md shadow-[#0066ff]/30'
                    : 'text-slate-400 hover:text-white hover:bg-[#14233c]'
                }`}
              >
                <Zap class="w-3.5 h-3.5" />
                1. Executive Summary
              </button>

              <button
                onClick={() => setActiveTab('segmentation')}
                class={`px-4 py-2 rounded-lg font-semibold text-xs tracking-wide transition-all flex items-center gap-2 whitespace-nowrap ${
                  activeTab === 'segmentation'
                    ? 'bg-[#0066ff] text-white shadow-md shadow-[#0066ff]/30'
                    : 'text-slate-400 hover:text-white hover:bg-[#14233c]'
                }`}
              >
                <Building2 class="w-3.5 h-3.5 text-[#00d2a0]" />
                2. Size & Billing Breakdown
              </button>

              <button
                onClick={() => setActiveTab('saas')}
                class={`px-4 py-2 rounded-lg font-semibold text-xs tracking-wide transition-all flex items-center gap-2 whitespace-nowrap ${
                  activeTab === 'saas'
                    ? 'bg-[#0066ff] text-white shadow-md shadow-[#0066ff]/30'
                    : 'text-slate-400 hover:text-white hover:bg-[#14233c]'
                }`}
              >
                <BarChart3 class="w-3.5 h-3.5 text-purple-400" />
                3. SaaS & Unit Economics
              </button>

              <button
                onClick={() => setActiveTab('directory')}
                class={`px-4 py-2 rounded-lg font-semibold text-xs tracking-wide transition-all flex items-center gap-2 whitespace-nowrap ${
                  activeTab === 'directory'
                    ? 'bg-[#0066ff] text-white shadow-md shadow-[#0066ff]/30'
                    : 'text-slate-400 hover:text-white hover:bg-[#14233c]'
                }`}
              >
                <Users class="w-3.5 h-3.5 text-blue-400" />
                4. Clinic Directory ({filteredClinics.length})
              </button>

              <button
                onClick={() => setActiveTab('calculator')}
                class={`px-4 py-2 rounded-lg font-semibold text-xs tracking-wide transition-all flex items-center gap-2 whitespace-nowrap ${
                  activeTab === 'calculator'
                    ? 'bg-[#0066ff] text-white shadow-md shadow-[#0066ff]/30'
                    : 'text-slate-400 hover:text-white hover:bg-[#14233c]'
                }`}
              >
                <Calculator class="w-3.5 h-3.5 text-amber-400" />
                5. ROI Calculator
              </button>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

            {/* TAB 1: EXECUTIVE SUMMARY */}
            {activeTab === 'summary' && (
              <div class="space-y-8">
                
                {/* 5 HERO METRIC CARDS */}
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                  
                  {/* Card 1: Annual Recurring Revenue */}
                  <div class="bg-[#0d182b] border border-[#1a2e4f] rounded-xl p-5 relative overflow-hidden group hover:border-[#0066ff]/50 transition-colors">
                    <div class="absolute top-0 left-0 w-1 h-full bg-[#0066ff]"></div>
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Live ARR</span>
                      <span class="p-1.5 rounded-lg bg-[#0066ff]/10 text-[#0066ff]">
                        <DollarSign class="w-4 h-4" />
                      </span>
                    </div>
                    <div class="text-2xl font-black text-white numeric mb-1">{fmtCurrency(summary.totalLiveArr)}</div>
                    <div class="flex items-center gap-1.5 text-xs text-[#00d2a0] font-medium">
                      <TrendingUp class="w-3.5 h-3.5" />
                      <span>{fmtCurrency(summary.totalLiveMrr)} / mo</span>
                    </div>
                  </div>

                  {/* Card 2: Active Practices & GPs */}
                  <div class="bg-[#0d182b] border border-[#1a2e4f] rounded-xl p-5 relative overflow-hidden group hover:border-[#00d2a0]/50 transition-colors">
                    <div class="absolute top-0 left-0 w-1 h-full bg-[#00d2a0]"></div>
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Clinics</span>
                      <span class="p-1.5 rounded-lg bg-[#00d2a0]/10 text-[#00d2a0]">
                        <Building2 class="w-4 h-4" />
                      </span>
                    </div>
                    <div class="text-2xl font-black text-white numeric mb-1">{summary.totalClinics - summary.droppedOffCount} Clinics</div>
                    <div class="text-xs text-slate-400 font-medium">
                      <span class="text-white font-bold">{summary.totalGps}</span> active GP Seats
                    </div>
                  </div>

                  {/* Card 3: Net Revenue Retention */}
                  <div class="bg-[#0d182b] border border-[#1a2e4f] rounded-xl p-5 relative overflow-hidden group hover:border-purple-500/50 transition-colors">
                    <div class="absolute top-0 left-0 w-1 h-full bg-purple-500"></div>
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Net Retention (NRR)</span>
                      <span class="p-1.5 rounded-lg bg-purple-500/10 text-purple-400">
                        <Activity class="w-4 h-4" />
                      </span>
                    </div>
                    <div class="text-2xl font-black text-white numeric mb-1">{summary.nrr}%</div>
                    <div class="text-xs text-slate-400 font-medium">
                      GRR: <span class="text-white font-bold">{summary.grr}%</span>
                    </div>
                  </div>

                  {/* Card 4: Runway & Burn Multiple */}
                  <div class="bg-[#0d182b] border border-[#1a2e4f] rounded-xl p-5 relative overflow-hidden group hover:border-amber-500/50 transition-colors">
                    <div class="absolute top-0 left-0 w-1 h-full bg-amber-500"></div>
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Cash Runway</span>
                      <span class="p-1.5 rounded-lg bg-amber-500/10 text-amber-400">
                        <Clock class="w-4 h-4" />
                      </span>
                    </div>
                    <div class="text-2xl font-black text-white numeric mb-1">{summary.runwayMonths} Mo</div>
                    <div class="text-xs text-slate-400 font-medium">
                      Burn Mult: <span class="text-white font-bold">{summary.burnMultiple}x</span>
                    </div>
                  </div>

                  {/* Card 5: Clinic Hours & Savings */}
                  <div class="bg-[#0d182b] border border-[#1a2e4f] rounded-xl p-5 relative overflow-hidden group hover:border-[#0066ff]/50 transition-colors">
                    <div class="absolute top-0 left-0 w-1 h-full bg-[#0066ff]"></div>
                    <div class="flex items-center justify-between mb-2">
                      <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Value Delivered</span>
                      <span class="p-1.5 rounded-lg bg-[#0066ff]/10 text-[#0066ff]">
                        <Award class="w-4 h-4" />
                      </span>
                    </div>
                    <div class="text-2xl font-black text-white numeric mb-1">{fmtNum(summary.totalHoursSaved)} hrs</div>
                    <div class="text-xs text-slate-400 font-medium">
                      Saved clinics <span class="text-[#00d2a0] font-bold">{fmtCurrency(summary.totalFinancialSavings)}</span>
                    </div>
                  </div>

                </div>

                {/* HIGHLIGHT: CLINIC SIZE & PAYMENT SCHEDULE QUICK CARDS */}
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                  
                  {/* Clinic Size Summary */}
                  <div class="bg-[#0d182b] border border-[#1a2e4f] rounded-xl p-6">
                    <div class="flex items-center justify-between mb-6">
                      <div>
                        <h3 class="text-base font-bold text-white flex items-center gap-2">
                          <Building2 class="w-4 h-4 text-[#0066ff]" />
                          Distribution by Clinic Size
                        </h3>
                        <p class="text-xs text-slate-400">ARR and practice count segmented by GP seats</p>
                      </div>
                      <button onClick={() => setActiveTab('segmentation')} class="text-xs font-semibold text-[#0066ff] hover:underline flex items-center gap-1">
                        Full Matrix <ArrowRight class="w-3 h-3" />
                      </button>
                    </div>

                    <div class="space-y-4">
                      {/* Small Practice */}
                      <div class="bg-[#14233c] p-4 rounded-lg flex items-center justify-between border border-[#1a2e4f]">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#0066ff]"></span>
                            <span class="text-sm font-bold text-white">Small Practice (1-3 GPs)</span>
                          </div>
                          <p class="text-xs text-slate-400 mt-1">{sizeSegmentation.small.count} Clinics • ARPU {fmtCurrency(sizeSegmentation.small.arpu)}</p>
                        </div>
                        <div class="text-right">
                          <div class="text-base font-black text-white numeric">{fmtCurrency(sizeSegmentation.small.totalArr)}</div>
                          <span class="text-xs text-slate-400">{sizeSegmentation.small.arrPct}% of ARR</span>
                        </div>
                      </div>

                      {/* Medium Centre */}
                      <div class="bg-[#14233c] p-4 rounded-lg flex items-center justify-between border border-[#1a2e4f]">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-[#00d2a0]"></span>
                            <span class="text-sm font-bold text-white">Medium Centre (4-9 GPs)</span>
                          </div>
                          <p class="text-xs text-slate-400 mt-1">{sizeSegmentation.medium.count} Clinics • ARPU {fmtCurrency(sizeSegmentation.medium.arpu)}</p>
                        </div>
                        <div class="text-right">
                          <div class="text-base font-black text-white numeric">{fmtCurrency(sizeSegmentation.medium.totalArr)}</div>
                          <span class="text-xs text-slate-400">{sizeSegmentation.medium.arrPct}% of ARR</span>
                        </div>
                      </div>

                      {/* Large Practice */}
                      <div class="bg-[#14233c] p-4 rounded-lg flex items-center justify-between border border-[#1a2e4f]">
                        <div>
                          <div class="flex items-center gap-2">
                            <span class="w-2.5 h-2.5 rounded-full bg-purple-500"></span>
                            <span class="text-sm font-bold text-white">Large Practice (10+ GPs)</span>
                          </div>
                          <p class="text-xs text-slate-400 mt-1">{sizeSegmentation.large.count} Clinics • ARPU {fmtCurrency(sizeSegmentation.large.arpu)}</p>
                        </div>
                        <div class="text-right">
                          <div class="text-base font-black text-white numeric">{fmtCurrency(sizeSegmentation.large.totalArr)}</div>
                          <span class="text-xs text-slate-400">{sizeSegmentation.large.arrPct}% of ARR</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Payment Schedule Summary */}
                  <div class="bg-[#0d182b] border border-[#1a2e4f] rounded-xl p-6">
                    <div class="flex items-center justify-between mb-6">
                      <div>
                        <h3 class="text-base font-bold text-white flex items-center gap-2">
                          <Receipt class="w-4 h-4 text-[#00d2a0]" />

                          <th class="p-3.5">Size Category</th>
                          <th class="p-3.5">Payment Schedule</th>
                          <th class="p-3.5 text-right">GPs</th>
                          <th class="p-3.5 text-right">ARR</th>
                          <th class="p-3.5 text-right">Agents</th>
                          <th class="p-3.5 text-right">Hours Saved</th>
                          <th class="p-3.5 text-center">Actions</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-[#1a2e4f]">
                        {filteredClinics.map((c) => (
                          <tr key={c.id} class="hover:bg-[#14233c]/60 transition-colors">
                            <td class="p-3.5 font-bold text-white">{c.name}</td>
                            <td class="p-3.5">
                              <span class={`px-2 py-0.5 rounded font-bold text-[10px] ${
                                c.status === 'Closed' ? 'bg-[#00d2a0]/20 text-[#00d2a0]' :
                                c.status === 'Pilot' ? 'bg-[#0066ff]/20 text-[#0066ff]' :
                                c.status === 'Warm Pilot' ? 'bg-amber-500/20 text-amber-400' :
                                'bg-red-500/20 text-red-400'
                              }`}>
                                {c.status}
                              </span>
                            </td>
                            <td class="p-3.5 text-slate-300">{c.clinicSizeCategory}</td>
                            <td class="p-3.5">
                              <span class={`px-2 py-0.5 rounded font-semibold text-[10px] ${
                                c.paymentSchedule === 'Annual' 
                                  ? 'bg-[#00d2a0]/15 text-[#00d2a0] border border-[#00d2a0]/30' 
                                  : 'bg-blue-500/15 text-blue-400 border border-blue-500/30'
                              }`}>
                                {c.paymentSchedule}
                              </span>
                            </td>
                            <td class="p-3.5 text-right font-bold text-white numeric">{c.numGps}</td>
                            <td class="p-3.5 text-right font-bold text-[#00d2a0] numeric">{fmtCurrency(c.arr)}</td>
                            <td class="p-3.5 text-right font-bold text-white">{c.agentCount} / 3</td>
                            <td class="p-3.5 text-right font-bold text-white numeric">{fmtNum(c.totalHoursSaved)} hr</td>
                            <td class="p-3.5 text-center">
                              <button 
                                onClick={() => setSelectedClinic(c)}
                                class="px-2.5 py-1 bg-[#14233c] hover:bg-[#0066ff] text-slate-300 hover:text-white rounded border border-[#1a2e4f] text-[11px] font-semibold transition-colors"
                              >
                                Details
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                </div>

              </div>
            )}

            {/* TAB 5: ROI CALCULATOR */}
            {activeTab === 'calculator' && (
              <div class="max-w-3xl mx-auto bg-[#0d182b] border border-[#1a2e4f] rounded-xl p-6">
                <div class="mb-6">
                  <h2 class="text-lg font-bold text-white flex items-center gap-2">
                    <Calculator class="w-5 h-5 text-amber-400" />
                    Interactive CareGP ROI & Billing Calculator
                  </h2>
                  <p class="text-xs text-slate-400">Estimate subscription cost, annual contract value, and GP hours saved</p>
                </div>

                <div class="space-y-6">
                  
                  {/* GP Count Slider */}
                  <div>
                    <div class="flex justify-between items-center mb-2">
                      <label class="text-xs font-semibold text-slate-300">Number of GPs in Practice</label>
                      <span class="text-sm font-black text-[#0066ff] numeric">{calcGps} GPs</span>
                    </div>
                    <input 
                      type="range" 
                      min="1" 
                      max="30" 
                      value={calcGps} 
                      onChange={(e) => setCalcGps(parseInt(e.target.value))}
                      class="w-full accent-[#0066ff] bg-[#14233c] h-2 rounded-lg cursor-pointer"
                    />
                  </div>

                  {/* Payment Schedule Switch */}
                  <div>
                    <label class="text-xs font-semibold text-slate-300 mb-2 block">Payment Schedule Commitment</label>
                    <div class="grid grid-cols-2 gap-3">
                      <button 
                        onClick={() => setCalcSchedule('Monthly')}
                        class={`p-3 rounded-lg border text-xs font-bold transition-all ${
                          calcSchedule === 'Monthly' 
                            ? 'bg-[#0066ff] text-white border-[#0066ff]' 
                            : 'bg-[#14233c] text-slate-300 border-[#1a2e4f]'
                        }`}
                      >
                        Monthly Billing ($125/GP/mo)
                      </button>
                      <button 
                        onClick={() => setCalcSchedule('Annual')}
                        class={`p-3 rounded-lg border text-xs font-bold transition-all ${
                          calcSchedule === 'Annual' 
                            ? 'bg-[#00d2a0] text-slate-950 border-[#00d2a0]' 
                            : 'bg-[#14233c] text-slate-300 border-[#1a2e4f]'
                        }`}
                      >
                        Annual Billing ($105/GP/mo • 15% OFF)
                      </button>
                    </div>
                  </div>

                  {/* Agent Count */}
                  <div>
                    <label class="text-xs font-semibold text-slate-300 mb-2 block">CareGP AI Agents Selected</label>
                    <div class="grid grid-cols-3 gap-3">
                      <button 
                        onClick={() => setCalcAgents(1)}
                        class={`p-3 rounded-lg border text-xs font-bold ${
                          calcAgents === 1 ? 'bg-[#0066ff] text-white border-[#0066ff]' : 'bg-[#14233c] text-slate-300 border-[#1a2e4f]'
                        }`}
                      >
                        1 Agent (Docs)
                      </button>
                      <button 
                        onClick={() => setCalcAgents(2)}
                        class={`p-3 rounded-lg border text-xs font-bold ${
                          calcAgents === 2 ? 'bg-[#0066ff] text-white border-[#0066ff]' : 'bg-[#14233c] text-slate-300 border-[#1a2e4f]'
                        }`}
                      >
                        2 Agents (+ Voice)
                      </button>
                      <button 
                        onClick={() => setCalcAgents(3)}
                        class={`p-3 rounded-lg border text-xs font-bold ${
                          calcAgents === 3 ? 'bg-[#0066ff] text-white border-[#0066ff]' : 'bg-[#14233c] text-slate-300 border-[#1a2e4f]'
                        }`}
                      >
                        3 Agents (+ Billing)
                      </button>
                    </div>
                  </div>

                  {/* CALCULATED RESULTS */}
                  {(() => {
                    const rate = calcSchedule === 'Annual' ? 105 : 125;
                    const mult = calcAgents === 3 ? 2.1 : calcAgents === 2 ? 1.5 : 1.0;
                    const monthlyCost = Math.round(calcGps * rate * mult);
                    const annualCost = monthlyCost * 12;
                    const estimatedHoursSavedMonth = Math.round(calcGps * 38);
                    const estimatedDollarSavingsMonth = estimatedHoursSavedMonth * 150;

                    return (
                      <div class="mt-6 pt-6 border-t border-[#1a2e4f] grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-[#14233c] p-4 rounded-xl border border-[#1a2e4f]">
                          <span class="text-xs text-slate-400 font-medium">Estimated CareGP Subscription</span>
                          <div class="text-2xl font-black text-white numeric mt-1">{fmtCurrency(monthlyCost)} <span class="text-xs font-medium text-slate-400">/ mo</span></div>
                          <div class="text-xs text-[#00d2a0] font-bold mt-1">{fmtCurrency(annualCost)} Annual Value</div>
                        </div>

                        <div class="bg-[#14233c] p-4 rounded-xl border border-[#00d2a0]/30">
                          <span class="text-xs text-slate-400 font-medium">Estimated Clinic ROI</span>
                          <div class="text-2xl font-black text-[#00d2a0] numeric mt-1">{fmtNum(estimatedHoursSavedMonth)} hrs <span class="text-xs text-slate-400">/ mo saved</span></div>
                          <div class="text-xs text-slate-300 font-bold mt-1">{fmtCurrency(estimatedDollarSavingsMonth)} clinic value saved</div>
                        </div>
                      </div>
                    );
                  })()}

                </div>
              </div>
            )}

          </main>

          {/* SLIDE-OVER DETAIL DRAWER FOR CLINIC */}
          {selectedClinic && (
            <div class="fixed inset-0 z-50 flex justify-end bg-black/60 backdrop-blur-sm">
              <div class="w-full max-w-lg bg-[#0d182b] border-l border-[#1a2e4f] h-full p-6 overflow-y-auto flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between pb-4 border-b border-[#1a2e4f] mb-6">
                    <div>
                      <h3 class="text-lg font-bold text-white">{selectedClinic.name}</h3>
                      <p class="text-xs text-slate-400">{selectedClinic.clinicSizeCategory} • {selectedClinic.paymentSchedule} Plan</p>
                    </div>
                    <button onClick={() => setSelectedClinic(null)} class="p-1.5 rounded-lg bg-[#14233c] hover:bg-[#1a2e4f] text-slate-400 hover:text-white">
                      <X class="w-5 h-5" />
                    </button>
                  </div>

                  <div class="space-y-4 text-xs">
                    <div class="bg-[#14233c] p-4 rounded-lg border border-[#1a2e4f] space-y-2">
                      <div class="flex justify-between">
                        <span class="text-slate-400">Status:</span>
                        <span class="font-bold text-[#00d2a0]">{selectedClinic.status}</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-400">GP Seats:</span>
                        <span class="font-bold text-white">{selectedClinic.numGps} GPs</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-400">Payment Schedule:</span>
                        <span class="font-bold text-white">{selectedClinic.paymentSchedule}</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-400">Annual Contract Value (ARR):</span>
                        <span class="font-bold text-[#00d2a0] numeric">{fmtCurrency(selectedClinic.arr)}</span>
                      </div>
                    </div>

                    <div class="bg-[#14233c] p-4 rounded-lg border border-[#1a2e4f] space-y-2">
                      <div class="flex justify-between">
                        <span class="text-slate-400">Hours Saved:</span>
                        <span class="font-bold text-white numeric">{fmtNum(selectedClinic.totalHoursSaved)} hrs</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-400">Financial Value Saved:</span>
                        <span class="font-bold text-[#00d2a0] numeric">{fmtCurrency(selectedClinic.financialSavings)}</span>
                      </div>
                      <div class="flex justify-between">
                        <span class="text-slate-400">Uploader Adoption:</span>
                        <span class="font-bold text-white">{selectedClinic.uploaderPct}%</span>
                      </div>
                    </div>
                  </div>
                </div>

                <div class="pt-6 border-t border-[#1a2e4f]">
                  <button onClick={() => setSelectedClinic(null)} class="w-full py-2.5 bg-[#0066ff] hover:bg-blue-600 text-white font-bold rounded-lg text-xs">
                    Close Details
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer class="bg-[#0d182b] border-t border-[#1a2e4f] py-6 text-center text-xs text-slate-500">
            <div class="max-w-7xl mx-auto px-4">
              CareGP Financial Dashboard • Australian Medical AI Intelligence Platform
            </div>
          </footer>

        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
