<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CareGP Financial Data Inspector</title>
</head>
<body>
  <div id="root">Loading...</div>
  <script>
    async function run() {
      try {
        const res = await fetch('./api/sheet-data?gid=192931357');
        const data = await res.json();
        console.log("===SHEET_JSON_START===");
        console.log(JSON.stringify(data));
        console.log("===SHEET_JSON_END===");
        document.getElementById('root').innerText = "DONE: " + data.rowCount + " rows";
      } catch (err) {
        console.error("Fetch error:", err);
      }
    }
    run();
  </script>
</body>
</html>
