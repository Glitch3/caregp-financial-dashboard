<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareGP — Executive Financial & Operational Intelligence</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            carenavy: {
              50: '#eef6ff',
              100: '#d9eaff',
              200: '#bcdaff',
              300: '#8ec1ff',
              400: '#589dff',
              500: '#0066ff', // CareGP Electric Blue
              600: '#0052db',
              700: '#0040b3',
              800: '#001a35', // CareGP Deep Navy
              900: '#00142b',
              950: '#000c1c',
            },
            caremint: {
              50: '#e6fff7',
              100: '#b3ffea',
              200: '#80ffd8',
              400: '#00e6ae',
              500: '#00d2a0', // CareGP Mint Green
              600: '#00a880',
              700: '#007e60',
            },
            caredark: {
              canvas: '#060c18',
              surface: '#0f1c33',
              elevated: '#172745',
              border: '#1a2e4f',
              borderStrong: '#253f6b'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Importmap for React 18, Lucide Icons, Recharts -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom",
      "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
    }
  }
  </script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Tabular numbers and custom scrollbars */
    .numeric, table, [data-numeric="true"] {
      font-variant-numeric: tabular-nums;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(6, 12, 24, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(37, 63, 107, 0.8);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 102, 255, 0.8);
    }
  </style>
</head>
<body class="bg-[#060c18] dark:bg-[#060c18] text-slate-100 min-h-screen font-sans antialiased selection:bg-[#0066ff] selection:text-white transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      TrendingUp, DollarSign, Clock, Building2, FileText, CheckCircle2, 
      AlertCircle, Search, RefreshCw, Download, ArrowUpRight, ArrowDownRight,
      ChevronDown, ChevronUp, Filter, Users, Cpu, ShieldCheck, Zap, Activity, Info, 
      Calculator, ArrowRight, X, ExternalLink, Calendar, HelpCircle, Flame,
      PieChart as PieIcon, Layers, Target, Scale, Award, Percent, BarChart3,
      Mic, Receipt, Sparkles, UserCheck, Heart, AlertTriangle, Moon, Sun, Shield
    } from 'lucide-react';
    import { 
      ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, 
      CartesianGrid, ScatterChart, Scatter, Cell, PieChart, Pie, Legend,
      AreaChart, Area, LineChart, Line
    } from 'recharts';

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [gpSizeFilter, setGpSizeFilter] = useState('All');
      const [activeTab, setActiveTab] = useState('overview'); // overview, retention, health, operations, strategic, calculator, clinics
      const [selectedClinic, setSelectedClinic] = useState(null);
      const [sortField, setSortField] = useState('financialSavings');
      const [sortDirection, setSortDir] = useState('desc');
      const [page, setPage] = useState(1);
      const [isDarkMode, setIsDarkMode] = useState(true);
      const pageSize = 20;

      // Dynamic Modeler & Simulator States
      const [simGps, setSimGps] = useState(15);
      const [simDocsPerGp, setSimDocsPerGp] = useState(25);
      const [simGpRate, setSimGpRate] = useState(150); // $150/hr
      const [simTimeSavedSec, setSimTimeSavedSec] = useState(20);
      const [simMonthlyBurn, setSimMonthlyBurn] = useState(85000);
      const [simCashBalance, setSimCashBalance] = useState(2400000);

      // Theme toggle
      const toggleTheme = () => {
        const nextMode = !isDarkMode;
        setIsDarkMode(nextMode);
        if (nextMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };

      // Keyboard shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === '/' && document.activeElement?.tagName !== 'INPUT') {
            e.preventDefault();
            document.getElementById('clinic-search-input')?.focus();
          }
          if (e.key === 'Escape') {
            setSelectedClinic(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const fetchData = async (force = false) => {
        if (force) setRefreshing(true);
        else setLoading(true);
        setError(null);

        try {
          const url = force ? './api/dashboard?refresh=true' : './api/dashboard';
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          setData(json);
        } catch (err) {
          console.error(err);
          setError(err.message || 'Failed to load dashboard data');
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Filtered clinics
      const filteredClinics = useMemo(() => {
        if (!data?.clinics) return [];
        return data.clinics.filter(c => {
          const matchesSearch = searchQuery === '' || 
            c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.comments.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.status.toLowerCase().includes(searchQuery.toLowerCase());

          const matchesStatus = statusFilter === 'All' || c.status === statusFilter;
          
          let matchesSize = true;
          if (gpSizeFilter === 'small') matchesSize = c.numGps >= 1 && c.numGps <= 5;
          else if (gpSizeFilter === 'medium') matchesSize = c.numGps > 5 && c.numGps <= 15;
          else if (gpSizeFilter === 'large') matchesSize = c.numGps > 15;

          return matchesSearch && matchesStatus && matchesSize;
        });
      }, [data, searchQuery, statusFilter, gpSizeFilter]);

      // Sorted clinics
      const sortedClinics = useMemo(() => {
        return [...filteredClinics].sort((a, b) => {
          let valA = a[sortField];
          let valB = b[sortField];
          if (typeof valA === 'string') {
            valA = valA.toLowerCase();
            valB = (valB || '').toLowerCase();
          }
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filteredClinics, sortField, sortDirection]);

      // Paginated clinics
      const paginatedClinics = useMemo(() => {
        const start = (page - 1) * pageSize;
        return sortedClinics.slice(start, start + pageSize);
      }, [sortedClinics, page]);

      const totalPages = Math.ceil(sortedClinics.length / pageSize) || 1;

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDir(sortDirection === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDir('desc');
        }
      };

      // Export CSV
      const exportCSV = () => {
        if (!filteredClinics.length) return;
        const headers = [
          "Clinic Name", "Status", "GPs", "Allocations", "Uploads", 
          "Uploader %", "Avg Accuracy %", "Agents Active", "Monthly Sub ($)", "Hours Saved", "Financial Savings ($)"
        ];
        const rows = filteredClinics.map(c => [
          `"${c.name.replace(/"/g, '""')}"`,
          c.status,
          c.numGps,
          c.allocations,
          c.uploads,
          `${c.uploaderPct.toFixed(1)}%`,
          `${c.avgAccuracy.toFixed(1)}%`,
          c.agentCount,
          c.monthlySubscription,
          c.totalHoursSaved.toFixed(1),
          c.financialSavings.toFixed(2)
        ]);

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `CareGP_Financial_Export_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Scenario Simulator Results
      const simResults = useMemo(() => {
        const dailySecSaved = simGps * simDocsPerGp * simTimeSavedSec;
        const dailyHours = dailySecSaved / 3600;
        const monthlyHours = dailyHours * 22;
        const annualHours = monthlyHours * 12;

        const monthlyGrossSavings = monthlyHours * simGpRate;
        const annualGrossSavings = annualHours * simGpRate;

        const estSubMonthly = simGps * 180; // $180/GP/mo multi-agent price
        const estSubAnnual = estSubMonthly * 12;

        const netAnnualSavings = annualGrossSavings - estSubAnnual;
        const roiMult = estSubAnnual > 0 ? annualGrossSavings / estSubAnnual : 0;
        const runway = simMonthlyBurn > 0 ? (simCashBalance / simMonthlyBurn).toFixed(1) : 0;

        return {
          dailyHours: dailyHours.toFixed(1),
          monthlyHours: monthlyHours.toFixed(0),
          annualHours: annualHours.toFixed(0),
          monthlyGrossSavings: monthlyGrossSavings.toFixed(0),
          annualGrossSavings: annualGrossSavings.toFixed(0),
          estSubAnnual: estSubAnnual.toFixed(0),
          netAnnualSavings: netAnnualSavings.toFixed(0),
          roiMult: roiMult.toFixed(1),
          runway
        };
      }, [simGps, simDocsPerGp, simGpRate, simTimeSavedSec, simMonthlyBurn, simCashBalance]);

      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen bg-[#060c18] text-slate-300 space-y-4">
            <div class="relative w-16 h-16">
              <div class="absolute inset-0 rounded-full border-4 border-[#0a192f]"></div>
              <div class="absolute inset-0 rounded-full border-4 border-[#0066ff] border-t-transparent animate-spin"></div>
            </div>
            <div class="text-center space-y-1">
              <h2 class="text-lg font-bold text-white tracking-wide">CareGP</h2>
              <p class="text-xs text-[#00d2a0] font-medium animate-pulse">Syncing Financial Metrics & Medical Practice Intelligence...</p>
            </div>
          </div>
        );
      }

      if (error) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen bg-[#060c18] p-6">
            <div class="bg-[#0f1c33] border border-red-500/30 rounded-2xl p-6 max-w-md w-full text-center space-y-4 shadow-2xl">
              <div class="w-12 h-12 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mx-auto">
                <AlertCircle size={24} />
              </div>
              <h2 class="text-lg font-bold text-white">Data Sync Failed</h2>
              <p class="text-sm text-slate-400">{error}</p>
              <button 
                onClick={() => fetchData(true)}
                class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-[#0066ff] hover:bg-[#0052db] text-white font-medium text-sm transition-colors"
              >
                <RefreshCw size={16} /> Retry Sync
              </button>
            </div>
          </div>
        );
      }

      const summary = data.summary;
      const meta = data.meta;
      const ret = summary.retention;
      const eff = summary.efficiency;
      const ops = summary.operations;
      const strat = summary.strategic;

      // Status pill badge helper matching CareGP brand
      const getStatusBadge = (status) => {
        switch(status) {
          case 'Closed':
            return <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[#00d2a0]/15 text-[#00d2a0] border border-[#00d2a0]/30"><span class="w-1.5 h-1.5 rounded-full bg-[#00d2a0]"></span>Closed</span>;
          case 'Pilot':
            return <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[#0066ff]/15 text-[#388eff] border border-[#0066ff]/30"><span class="w-1.5 h-1.5 rounded-full bg-[#0066ff]"></span>Pilot</span>;
          case 'Warm Pilot':
            return <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-500/15 text-amber-400 border border-amber-500/30"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Warm Pilot</span>;
          case 'Dropped Off':
            return <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-rose-500/15 text-rose-400 border border-rose-500/30"><span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>Dropped Off</span>;
          default:
            return <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">{status}</span>;
        }
      };

      // Agent distribution pie chart
      const agentDistChartData = [
        { name: '1 Agent (Documents)', value: ret.agentDistribution.singleAgent, color: '#0066ff' },
        { name: '2 Agents (Docs + Voice)', value: ret.agentDistribution.dualAgent, color: '#00d2a0' },
        { name: '3 Agents (Docs + Voice + Billing)', value: ret.agentDistribution.triAgent, color: '#8b5cf6' },
      ];

      // Top 10 ROI chart
      const topSavingsChartData = [...data.clinics]
        .sort((a,b) => b.financialSavings - a.financialSavings)
        .slice(0, 10)
        .map(c => ({
          name: c.name.length > 18 ? c.name.slice(0, 16) + '...' : c.name,
          fullName: c.name,
          savings: Math.round(c.financialSavings),
          hours: Math.round(c.totalHoursSaved)
        }));

      return (
        <div class="min-h-screen bg-slate-50 dark:bg-[#060c18] text-slate-900 dark:text-slate-100 flex flex-col transition-colors duration-200">
          
          {/* TOP ANNOUNCEMENT / REGULATORY COMPLIANCE BAR */}
          <div class="bg-gradient-to-r from-[#001a35] via-[#002b5c] to-[#001a35] text-white px-4 py-1.5 text-xs border-b border-[#003d80] flex flex-wrap items-center justify-between gap-2 shadow-sm">
            <div class="flex items-center gap-2 font-medium">
              <span class="inline-flex items-center gap-1 text-[#00d2a0] font-bold">
                <Shield size={14} /> 🇦🇺 CareGP Australia
              </span>
              <span class="hidden sm:inline text-slate-300">|</span>
              <span class="hidden sm:inline text-slate-300">Australian Health Data Sovereignty (Sydney DCs) • RACGP & AHPRA Compliant</span>
            </div>
            <div class="flex items-center gap-4 text-[11px] text-slate-300">
              <span class="flex items-center gap-1">
                <CheckCircle2 size={12} class="text-[#00d2a0]" /> Best Practice Ready
              </span>
              <span class="flex items-center gap-1">
                <CheckCircle2 size={12} class="text-[#00d2a0]" /> MedicalDirector Ready
              </span>
              <a href="https://www.caregp.com.au" target="_blank" rel="noopener noreferrer" class="text-[#388eff] hover:underline flex items-center gap-0.5 font-medium">
                caregp.com.au <ExternalLink size={10} />
              </a>
            </div>
          </div>

          {/* MAIN CAREGP NAVIGATION HEADER */}
          <header class="sticky top-0 z-30 bg-[#001a35]/95 dark:bg-[#060c18]/95 backdrop-blur-md border-b border-[#003d80] dark:border-[#1a2e4f] px-4 lg:px-8 py-3.5 flex flex-wrap items-center justify-between gap-4 text-white shadow-lg">
            <div class="flex items-center gap-3">
              <a href="https://www.caregp.com.au" target="_blank" class="flex items-center gap-2.5 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#0066ff] via-[#00a3ff] to-[#00d2a0] flex items-center justify-center text-white font-bold shadow-lg shadow-[#0066ff]/20 group-hover:scale-105 transition-transform">
                  <Activity size={22} className="text-white" />
                </div>
                <div>
                  <div class="flex items-center gap-1.5">
                    <span class="text-xl font-black tracking-tight text-white font-sans">
                      Care<span class="text-[#00a3ff]">GP</span>
                    </span>
                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#00d2a0]/20 text-[#00d2a0] border border-[#00d2a0]/40 uppercase tracking-wide">
                      Financial Intelligence
                    </span>
                  </div>
                  <p class="text-[11px] text-slate-300 font-medium">Executive SaaS Metrics & Clinic Practice Analytics</p>
                </div>
              </a>
            </div>

            <div class="flex items-center gap-3 flex-wrap">
              {/* Search Input */}
              <div class="relative w-64 md:w-72">
                <Search size={15} class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                <input 
                  id="clinic-search-input"
                  type="text"
                  placeholder="Search clinic or notes... (/)"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  class="w-full h-8.5 pl-9 pr-8 rounded-lg bg-[#000c1c] dark:bg-[#0f1c33] border border-[#003d80] dark:border-[#1a2e4f] text-xs text-white placeholder:text-slate-400 focus:outline-none focus:border-[#0066ff] transition-all"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white">
                    <X size={13} />
                  </button>
                )}
              </div>

              {/* Sync Status Badge */}
              <div class="flex items-center gap-2 bg-[#000c1c] dark:bg-[#0f1c33] px-3 py-1.5 rounded-lg border border-[#003d80] dark:border-[#1a2e4f] text-xs text-slate-300">
                <span class={`w-2 h-2 rounded-full ${meta.isCached ? 'bg-amber-400' : 'bg-[#00d2a0]'} animate-pulse`}></span>
                <span class="font-medium">{meta.isCached ? 'Cached' : 'Live Sheets'}</span>
                <span class="text-slate-600">|</span>
                <span class="text-[11px] text-slate-400">{meta.topLastUpdated}</span>
              </div>

              {/* Theme Toggle */}
              <button 
                onClick={toggleTheme}
                title="Toggle Dark/Light Mode"
                class="h-8.5 px-2.5 rounded-lg bg-[#002b5c] dark:bg-[#0f1c33] hover:bg-[#003d80] text-slate-200 text-xs font-medium border border-[#003d80] dark:border-[#1a2e4f] flex items-center gap-1.5 transition-all"
              >
                {isDarkMode ? <Sun size={14} class="text-amber-400" /> : <Moon size={14} class="text-[#00a3ff]" />}
              </button>

              <button 
                onClick={() => fetchData(true)}
                disabled={refreshing}
                class="h-8.5 px-3 rounded-lg bg-[#002b5c] dark:bg-[#0f1c33] hover:bg-[#003d80] text-white text-xs font-medium border border-[#003d80] dark:border-[#1a2e4f] flex items-center gap-1.5 transition-all disabled:opacity-50"
              >
                <RefreshCw size={13} class={refreshing ? 'animate-spin' : ''} />
                <span>Refresh</span>
              </button>

              <button 
                onClick={exportCSV}
                class="h-8.5 px-3.5 rounded-lg bg-[#0066ff] hover:bg-[#0052db] text-white text-xs font-semibold flex items-center gap-1.5 transition-all shadow-md shadow-[#0066ff]/20"
              >
                <Download size={13} />
                <span>Export CSV</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTENT CONTAINER */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 space-y-6">

            {/* TOP METRIC HIGHLIGHT STRIP (CAREGP 5 CORE METRICS) */}
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3.5">
              
              {/* 1. Live ARR / MRR */}
              <div class="bg-white dark:bg-[#0f1c33] border border-slate-200 dark:border-[#1a2e4f] rounded-xl p-4 shadow-sm relative overflow-hidden group hover:border-[#0066ff] transition-all">
                <div class="text-xs text-slate-500 dark:text-slate-400 font-semibold uppercase tracking-wider mb-1 flex items-center justify-between">
                  <span>Live ARR / MRR</span>
                  <DollarSign size={16} class="text-[#0066ff]" />
                </div>
                <div class="text-2xl font-bold text-slate-900 dark:text-white numeric tracking-tight">
                  ${Math.round(summary.totalLiveArr).toLocaleString()}
                </div>
                <div class="text-xs text-[#0066ff] font-semibold mt-1 flex items-center gap-1">
                  <TrendingUp size={12} /> ${Math.round(summary.totalLiveMrr).toLocaleString()} / mo MRR
                </div>
              </div>

              {/* 2. NRR % */}
              <div class="bg-white dark:bg-[#0f1c33] border border-slate-200 dark:border-[#1a2e4f] rounded-xl p-4 shadow-sm relative overflow-hidden group hover:border-[#00d2a0] transition-all">
                <div class="text-xs text-slate-500 dark:text-slate-400 font-semibold uppercase tracking-wider mb-1 flex items-center justify-between">
                  <span>Net Retention (NRR)</span>
                  <TrendingUp size={16} class="text-[#00d2a0]" />
                </div>
                <div class="text-2xl font-bold text-slate-900 dark:text-white numeric tracking-tight">
                  {ret.nrr}%
                </div>
                <div class="text-xs text-[#00d2a0] font-semibold mt-1">
                  GRR: {ret.grr}% (&ge;85% Healthy)
                </div>
              </div>

              {/* 3. Burn Multiple & Runway */}
              <div class="bg-white dark:bg-[#0f1c33] border border-slate-200 dark:border-[#1a2e4f] rounded-xl p-4 shadow-sm relative overflow-hidden group hover:border-amber-400 transition-all">
                <div class="text-xs text-slate-500 dark:text-slate-400 font-semibold uppercase tracking-wider mb-1 flex items-center justify-between">
                  <span>Burn Multiple</span>
                  <Flame size={16} class="text-amber-500 dark:text-amber-400" />
                </div>
                <div class="text-2xl font-bold text-slate-900 dark:text-white numeric tracking-tight">
                  {eff.burnMultiple}x
                </div>
                <div class="text-xs text-amber-600 dark:text-amber-400 font-semibold mt-1">
                  {eff.runwayMonths} Months Runway
                </div>

                            {c.totalHoursSaved > 0 ? `${Math.round(c.totalHoursSaved).toLocaleString()} h` : '-'}
                          </td>
                          <td class="p-3.5 text-right numeric font-bold text-[#00d2a0]">
                            {c.financialSavings > 0 ? `$${Math.round(c.financialSavings).toLocaleString()}` : '-'}
                          </td>
                        </tr>
                      ))}

                      {paginatedClinics.length === 0 && (
                        <tr>
                          <td colspan="9" class="p-8 text-center text-slate-500">
                            No clinics matched your filter or search query.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

                <div class="p-3 border-t border-slate-200 dark:border-[#1a2e4f] flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 bg-slate-50 dark:bg-[#060c18]">
                  <span>Page {page} of {totalPages}</span>
                  <div class="flex items-center gap-1">
                    <button 
                      onClick={() => setPage(p => Math.max(1, p - 1))}
                      disabled={page === 1}
                      class="px-3 py-1 rounded-lg bg-white dark:bg-[#0f1c33] hover:bg-slate-100 dark:hover:bg-[#1a2e4f] disabled:opacity-40 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-[#1a2e4f] font-medium"
                    >
                      Previous
                    </button>
                    <button 
                      onClick={() => setPage(p => Math.min(totalPages, p + 1))}
                      disabled={page === totalPages}
                      class="px-3 py-1 rounded-lg bg-white dark:bg-[#0f1c33] hover:bg-slate-100 dark:hover:bg-[#1a2e4f] disabled:opacity-40 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-[#1a2e4f] font-medium"
                    >
                      Next
                    </button>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* CLINIC DETAIL MODAL */}
          {selectedClinic && (
            <div class="fixed inset-0 z-50 bg-slate-900/60 dark:bg-[#060c18]/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-white dark:bg-[#0f1c33] border border-slate-200 dark:border-[#1a2e4f] rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 space-y-6">
                
                <div class="flex items-start justify-between border-b border-slate-200 dark:border-[#1a2e4f] pb-4">
                  <div>
                    <div class="flex items-center gap-2">
                      <h3 class="text-lg font-bold text-slate-900 dark:text-white">{selectedClinic.name}</h3>
                      {getStatusBadge(selectedClinic.status)}
                    </div>
                    {selectedClinic.comments && (
                      <p class="text-xs text-amber-600 dark:text-amber-400 mt-1.5 bg-amber-500/10 px-2.5 py-1 rounded-lg border border-amber-500/20 inline-block font-medium">
                        Note: {selectedClinic.comments}
                      </p>
                    )}
                  </div>

                  <button onClick={() => setSelectedClinic(null)} class="p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-[#1a2e4f] text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
                    <X size={18} />
                  </button>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                  <div class="bg-slate-50 dark:bg-[#060c18] p-3 rounded-xl border border-slate-200 dark:border-[#1a2e4f]">
                    <span class="text-slate-500 dark:text-slate-400 font-medium">Total Financial Savings</span>
                    <div class="text-lg font-bold text-[#00d2a0] numeric mt-1">
                      ${Math.round(selectedClinic.financialSavings).toLocaleString()}
                    </div>
                  </div>

                  <div class="bg-slate-50 dark:bg-[#060c18] p-3 rounded-xl border border-slate-200 dark:border-[#1a2e4f]">
                    <span class="text-slate-500 dark:text-slate-400 font-medium">Hours Reclaimed</span>
                    <div class="text-lg font-bold text-slate-900 dark:text-white numeric mt-1">
                      {Math.round(selectedClinic.totalHoursSaved)} hrs
                    </div>
                  </div>

                  <div class="bg-slate-50 dark:bg-[#060c18] p-3 rounded-xl border border-slate-200 dark:border-[#1a2e4f]">
                    <span class="text-slate-500 dark:text-slate-400 font-medium">Active Agents</span>
                    <div class="text-lg font-bold text-purple-600 dark:text-purple-400 numeric mt-1">
                      {selectedClinic.agentCount} / 3 Agents
                    </div>
                  </div>

                  <div class="bg-slate-50 dark:bg-[#060c18] p-3 rounded-xl border border-slate-200 dark:border-[#1a2e4f]">
                    <span class="text-slate-500 dark:text-slate-400 font-medium">Monthly Subscription</span>
                    <div class="text-lg font-bold text-[#0066ff] dark:text-[#388eff] numeric mt-1">
                      ${selectedClinic.monthlySubscription}/mo
                    </div>
                  </div>
                </div>

                <div class="space-y-3 bg-slate-50 dark:bg-[#060c18] p-4 rounded-xl border border-slate-200 dark:border-[#1a2e4f]">
                  <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700 dark:text-slate-300">Accuracy & Verification Layers</h4>
                  
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                    <div class="bg-white dark:bg-[#0f1c33] p-2.5 rounded-lg border border-slate-200 dark:border-[#1a2e4f]">
                      <div class="text-slate-500 dark:text-slate-400 text-[10px] font-medium">Layer 1 (OCR)</div>
                      <div class="font-bold text-slate-800 dark:text-slate-200 mt-0.5">{selectedClinic.accuracyL1.toFixed(1)}%</div>
                    </div>
                    <div class="bg-white dark:bg-[#0f1c33] p-2.5 rounded-lg border border-slate-200 dark:border-[#1a2e4f]">
                      <div class="text-slate-500 dark:text-slate-400 text-[10px] font-medium">Layer 2 (Entities)</div>
                      <div class="font-bold text-slate-800 dark:text-slate-200 mt-0.5">{selectedClinic.accuracyL2.toFixed(1)}%</div>
                    </div>
                    <div class="bg-white dark:bg-[#0f1c33] p-2.5 rounded-lg border border-slate-200 dark:border-[#1a2e4f]">
                      <div class="text-slate-500 dark:text-slate-400 text-[10px] font-medium">Layer 3 (Coding)</div>
                      <div class="font-bold text-slate-800 dark:text-slate-200 mt-0.5">{selectedClinic.accuracyL3.toFixed(1)}%</div>
                    </div>
                    <div class="bg-white dark:bg-[#0f1c33] p-2.5 rounded-lg border border-slate-200 dark:border-[#1a2e4f]">
                      <div class="text-slate-500 dark:text-slate-400 text-[10px] font-medium">Layer 4 (Safety)</div>
                      <div class="font-bold text-slate-800 dark:text-slate-200 mt-0.5">{selectedClinic.accuracyL4.toFixed(1)}%</div>
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-3 text-xs text-slate-700 dark:text-slate-300 bg-slate-50 dark:bg-[#060c18] p-4 rounded-xl border border-slate-200 dark:border-[#1a2e4f]">
                  <div>
                    <span class="text-slate-500">Document Allocations:</span> <strong class="text-slate-900 dark:text-slate-200">{selectedClinic.allocations.toLocaleString()}</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Document Uploads:</span> <strong class="text-slate-900 dark:text-slate-200">{selectedClinic.uploads.toLocaleString()}</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Pilot Launch Date:</span> <strong class="text-slate-900 dark:text-slate-200">{selectedClinic.pilotStartDate || 'N/A'}</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Days Elapsed:</span> <strong class="text-slate-900 dark:text-slate-200">{selectedClinic.daysElapsed} days</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Time Saved / Doc:</span> <strong class="text-[#00d2a0] font-bold">{selectedClinic.timePerDocSec.toFixed(1)} seconds</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">NPS Score:</span> <strong class="text-[#00d2a0] font-bold">+{selectedClinic.nps}</strong>
                  </div>
                </div>

                <div class="flex justify-end pt-2">
                  <button onClick={() => setSelectedClinic(null)} class="px-4 py-2 bg-slate-100 dark:bg-[#1a2e4f] hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-800 dark:text-slate-200 text-xs font-semibold rounded-lg border border-slate-200 dark:border-[#1a2e4f]">
                    Close Details
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER MATCHING CAREGP BRANDING */}
          <footer class="border-t border-slate-200 dark:border-[#1a2e4f] py-4 px-4 text-center text-xs text-slate-500 dark:text-slate-400 bg-white dark:bg-[#000c1c]">
            <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2 font-medium">
                <span class="text-slate-900 dark:text-white font-bold">Care<span class="text-[#00a3ff]">GP</span></span>
                <span>• Financial & Operational Intelligence Dashboard</span>
              </div>
              <div>
                Connected to CareGP Google Sheet ({summary.totalClinics} General Practices)
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
