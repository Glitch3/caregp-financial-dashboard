<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareGP — Executive Financial & Operational Intelligence</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            dark: {
              canvas: '#0b0f19',
              surface: '#111827',
              elevated: '#1f2937',
              border: '#1f2937',
              borderStrong: '#374151'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Importmap for React 18, Lucide Icons, Recharts -->
  <script type="importmap">
  {
    "imports": {
      "react": "https://esm.sh/react@18.3.1",
      "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
      "react-dom": "https://esm.sh/react-dom@18.3.1",
      "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
      "lucide-react": "https://esm.sh/lucide-react@0.400.0?external=react,react-dom",
      "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
    }
  }
  </script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <style>
    /* Tabular numbers and scrollbars */
    .numeric, table, [data-numeric="true"] {
      font-variant-numeric: tabular-nums;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(11, 15, 25, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel" data-type="module" data-presets="react">
    import React, { useState, useEffect, useMemo } from 'react';
    import { createRoot } from 'react-dom/client';
    import { 
      TrendingUp, DollarSign, Clock, Building2, FileText, CheckCircle2, 
      AlertCircle, Search, RefreshCw, Download, ArrowUpRight, ArrowDownRight,
      ChevronDown, ChevronUp, Filter, Users, Cpu, ShieldCheck, Zap, Activity, Info, 
      Calculator, ArrowRight, X, ExternalLink, Calendar, HelpCircle, Flame,
      PieChart as PieIcon, Layers, Target, Scale, Award, Percent, BarChart3,
      Mic, Receipt, Sparkles, UserCheck, Heart, AlertTriangle
    } from 'lucide-react';
    import { 
      ResponsiveContainer, BarChart, Bar, XAxis, YAxis, Tooltip, 
      CartesianGrid, ScatterChart, Scatter, Cell, PieChart, Pie, Legend,
      AreaChart, Area, LineChart, Line
    } from 'recharts';

    function App() {
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [refreshing, setRefreshing] = useState(false);
      const [error, setError] = useState(null);
      const [searchQuery, setSearchQuery] = useState('');
      const [statusFilter, setStatusFilter] = useState('All');
      const [gpSizeFilter, setGpSizeFilter] = useState('All');
      const [activeTab, setActiveTab] = useState('overview'); // overview, retention, health, operations, strategic, calculator, clinics
      const [selectedClinic, setSelectedClinic] = useState(null);
      const [sortField, setSortField] = useState('financialSavings');
      const [sortDirection, setSortDir] = useState('desc');
      const [page, setPage] = useState(1);
      const pageSize = 20;

      // Dynamic Modeler & Simulator States
      const [simGps, setSimGps] = useState(15);
      const [simDocsPerGp, setSimDocsPerGp] = useState(25);
      const [simGpRate, setSimGpRate] = useState(150); // $150/hr
      const [simTimeSavedSec, setSimTimeSavedSec] = useState(20);
      const [simMonthlyBurn, setSimMonthlyBurn] = useState(85000);
      const [simCashBalance, setSimCashBalance] = useState(2400000);
      const [simFteCount, setSimFteCount] = useState(24);

      // Keyboard shortcuts
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.key === '/' && document.activeElement?.tagName !== 'INPUT') {
            e.preventDefault();
            document.getElementById('clinic-search-input')?.focus();
          }
          if (e.key === 'Escape') {
            setSelectedClinic(null);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      const fetchData = async (force = false) => {
        if (force) setRefreshing(true);
        else setLoading(true);
        setError(null);

        try {
          const url = force ? './api/dashboard?refresh=true' : './api/dashboard';
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const json = await res.json();
          setData(json);
        } catch (err) {
          console.error(err);
          setError(err.message || 'Failed to load dashboard data');
        } finally {
          setLoading(false);
          setRefreshing(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Filtered clinics
      const filteredClinics = useMemo(() => {
        if (!data?.clinics) return [];
        return data.clinics.filter(c => {
          const matchesSearch = searchQuery === '' || 
            c.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.comments.toLowerCase().includes(searchQuery.toLowerCase()) ||
            c.status.toLowerCase().includes(searchQuery.toLowerCase());

          const matchesStatus = statusFilter === 'All' || c.status === statusFilter;
          
          let matchesSize = true;
          if (gpSizeFilter === 'small') matchesSize = c.numGps >= 1 && c.numGps <= 5;
          else if (gpSizeFilter === 'medium') matchesSize = c.numGps > 5 && c.numGps <= 15;
          else if (gpSizeFilter === 'large') matchesSize = c.numGps > 15;

          return matchesSearch && matchesStatus && matchesSize;
        });
      }, [data, searchQuery, statusFilter, gpSizeFilter]);

      // Sorted clinics
      const sortedClinics = useMemo(() => {
        return [...filteredClinics].sort((a, b) => {
          let valA = a[sortField];
          let valB = b[sortField];
          if (typeof valA === 'string') {
            valA = valA.toLowerCase();
            valB = (valB || '').toLowerCase();
          }
          if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
          if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
          return 0;
        });
      }, [filteredClinics, sortField, sortDirection]);

      // Paginated clinics
      const paginatedClinics = useMemo(() => {
        const start = (page - 1) * pageSize;
        return sortedClinics.slice(start, start + pageSize);
      }, [sortedClinics, page]);

      const totalPages = Math.ceil(sortedClinics.length / pageSize) || 1;

      const handleSort = (field) => {
        if (sortField === field) {
          setSortDir(sortDirection === 'asc' ? 'desc' : 'asc');
        } else {
          setSortField(field);
          setSortDir('desc');
        }
      };

      // Export CSV
      const exportCSV = () => {
        if (!filteredClinics.length) return;
        const headers = [
          "Clinic Name", "Status", "GPs", "Allocations", "Uploads", 
          "Uploader %", "Avg Accuracy %", "Agents Active", "Monthly Sub ($)", "Hours Saved", "Financial Savings ($)"
        ];
        const rows = filteredClinics.map(c => [
          `"${c.name.replace(/"/g, '""')}"`,
          c.status,
          c.numGps,
          c.allocations,
          c.uploads,
          `${c.uploaderPct.toFixed(1)}%`,
          `${c.avgAccuracy.toFixed(1)}%`,
          c.agentCount,
          c.monthlySubscription,
          c.totalHoursSaved.toFixed(1),
          c.financialSavings.toFixed(2)
        ]);

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `CareGP_Financial_Export_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Scenario Simulator Results
      const simResults = useMemo(() => {
        const dailySecSaved = simGps * simDocsPerGp * simTimeSavedSec;
        const dailyHours = dailySecSaved / 3600;
        const monthlyHours = dailyHours * 22;
        const annualHours = monthlyHours * 12;

        const monthlyGrossSavings = monthlyHours * simGpRate;
        const annualGrossSavings = annualHours * simGpRate;

        const estSubMonthly = simGps * 180; // $180/GP/mo multi-agent price
        const estSubAnnual = estSubMonthly * 12;

        const netAnnualSavings = annualGrossSavings - estSubAnnual;
        const roiMult = estSubAnnual > 0 ? annualGrossSavings / estSubAnnual : 0;
        const runway = simMonthlyBurn > 0 ? (simCashBalance / simMonthlyBurn).toFixed(1) : 0;

        return {
          dailyHours: dailyHours.toFixed(1),
          monthlyHours: monthlyHours.toFixed(0),
          annualHours: annualHours.toFixed(0),
          monthlyGrossSavings: monthlyGrossSavings.toFixed(0),
          annualGrossSavings: annualGrossSavings.toFixed(0),
          estSubAnnual: estSubAnnual.toFixed(0),
          netAnnualSavings: netAnnualSavings.toFixed(0),
          roiMult: roiMult.toFixed(1),
          runway
        };
      }, [simGps, simDocsPerGp, simGpRate, simTimeSavedSec, simMonthlyBurn, simCashBalance]);

      if (loading) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen bg-slate-950 text-slate-300 space-y-4">
            <div class="relative w-16 h-16">
              <div class="absolute inset-0 rounded-full border-4 border-slate-800"></div>
              <div class="absolute inset-0 rounded-full border-4 border-emerald-500 border-t-transparent animate-spin"></div>
            </div>
            <p class="text-sm font-medium tracking-wide text-slate-400 animate-pulse">Syncing CareGP Financial & SaaS Metrics from Google Sheets...</p>
          </div>
        );
      }

      if (error) {
        return (
          <div class="flex flex-col items-center justify-center min-h-screen bg-slate-950 p-6">
            <div class="bg-slate-900 border border-red-500/30 rounded-xl p-6 max-w-md w-full text-center space-y-4 shadow-2xl">
              <div class="w-12 h-12 bg-red-500/10 text-red-400 rounded-full flex items-center justify-center mx-auto">
                <AlertCircle size={24} />
              </div>
              <h2 class="text-lg font-bold text-slate-100">Data Sync Failed</h2>
              <p class="text-sm text-slate-400">{error}</p>
              <button 
                onClick={() => fetchData(true)}
                class="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-medium text-sm transition-colors"
              >
                <RefreshCw size={16} /> Retry Sync
              </button>
            </div>
          </div>
        );
      }

      const summary = data.summary;
      const meta = data.meta;
      const ret = summary.retention;
      const eff = summary.efficiency;
      const ops = summary.operations;
      const strat = summary.strategic;

      // Status pill color map
      const getStatusBadge = (status) => {
        switch(status) {
          case 'Closed':
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20"><span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>Closed</span>;
          case 'Pilot':
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20"><span class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>Pilot</span>;
          case 'Warm Pilot':
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-amber-500/10 text-amber-400 border border-amber-500/20"><span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>Warm Pilot</span>;
          case 'Dropped Off':
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-rose-500/10 text-rose-400 border border-rose-500/20"><span class="w-1.5 h-1.5 rounded-full bg-rose-400"></span>Dropped Off</span>;
          default:
            return <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded text-xs font-semibold bg-slate-800 text-slate-300 border border-slate-700">{status}</span>;
        }
      };

      // Agent distribution pie chart
      const agentDistChartData = [
        { name: '1 Agent (Docs)', value: ret.agentDistribution.singleAgent, color: '#3b82f6' },
        { name: '2 Agents (Docs + Voice)', value: ret.agentDistribution.dualAgent, color: '#10b981' },
        { name: '3 Agents (Docs + Voice + Billing)', value: ret.agentDistribution.triAgent, color: '#8b5cf6' },
      ];

      // Top 10 ROI chart
      const topSavingsChartData = [...data.clinics]
        .sort((a,b) => b.financialSavings - a.financialSavings)
        .slice(0, 10)
        .map(c => ({
          name: c.name.length > 18 ? c.name.slice(0, 16) + '...' : c.name,
          fullName: c.name,
          savings: Math.round(c.financialSavings),
          hours: Math.round(c.totalHoursSaved)
        }));

      return (
        <div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* HEADER */}
          <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-600 to-teal-400 flex items-center justify-center text-slate-950 font-bold shadow-lg shadow-emerald-500/20">
                <Activity size={20} />
              </div>
              <div>
                <div class="flex items-center gap-2">
                  <h1 class="text-base font-bold tracking-tight text-slate-100">CareGP</h1>
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                    SaaS Financial & Operational Intelligence
                  </span>
                </div>
                <p class="text-xs text-slate-400">Live ROI, Unit Economics, Retention & Multi-Agent Analytics</p>
              </div>
            </div>

            <div class="flex items-center gap-3 flex-wrap">
              {/* Search Bar */}
              <div class="relative w-64 md:w-72">
                <Search size={15} class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                <input 
                  id="clinic-search-input"
                  type="text"
                  placeholder="Search clinic or comments... (/)"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  class="w-full h-8 pl-9 pr-8 rounded-lg bg-slate-950 border border-slate-800 text-xs text-slate-200 placeholder:text-slate-500 focus:outline-none focus:border-emerald-500 transition-all"
                />
                {searchQuery && (
                  <button onClick={() => setSearchQuery('')} class="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-200">
                    <X size={13} />
                  </button>
                )}
              </div>

              {/* Sync Status Badge */}
              <div class="flex items-center gap-2 bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-xs text-slate-400">
                <span class={`w-2 h-2 rounded-full ${meta.isCached ? 'bg-amber-400' : 'bg-emerald-400'} animate-pulse`}></span>
                <span>{meta.isCached ? 'Cached' : 'Sheets Live'}</span>
                <span class="text-slate-600">|</span>
                <span class="text-[11px] text-slate-500">{meta.topLastUpdated}</span>
              </div>

              <button 
                onClick={() => fetchData(true)}
                disabled={refreshing}
                class="h-8 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium border border-slate-700 flex items-center gap-1.5 transition-all disabled:opacity-50"
              >
                <RefreshCw size={13} class={refreshing ? 'animate-spin' : ''} />
                <span>Refresh</span>
              </button>

              <button 
                onClick={exportCSV}
                class="h-8 px-3 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-medium flex items-center gap-1.5 transition-all shadow-md shadow-emerald-600/20"
              >
                <Download size={13} />
                <span>Export CSV</span>
              </button>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-6 space-y-6">

            {/* TOP EXECUTIVE METRIC BANNER (5 HIGHLIGHT CARDS) */}
            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
              
              {/* 1. Live ARR & MRR */}
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 relative overflow-hidden group hover:border-slate-700 transition-all">
                <div class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-1 flex items-center justify-between">
                  <span>Live ARR / MRR</span>
                  <DollarSign size={15} class="text-emerald-400" />
                </div>
                <div class="text-xl font-bold text-slate-100 numeric tracking-tight">
                  ${Math.round(summary.totalLiveArr).toLocaleString()}
                </div>
                <div class="text-[11px] text-emerald-400 font-semibold mt-1">
                  ${Math.round(summary.totalLiveMrr).toLocaleString()} / mo MRR
                </div>
              </div>

              {/* 2. NRR % */}
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 relative overflow-hidden group hover:border-slate-700 transition-all">
                <div class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-1 flex items-center justify-between">
                  <span>NRR %</span>
                  <TrendingUp size={15} class="text-blue-400" />
                </div>
                <div class="text-xl font-bold text-slate-100 numeric tracking-tight">
                  {ret.nrr}%
                </div>
                <div class="text-[11px] text-blue-400 font-semibold mt-1">
                  GRR: {ret.grr}% (Healthy &gt;85%)
                </div>
              </div>

              {/* 3. Burn Multiple & Runway */}
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 relative overflow-hidden group hover:border-slate-700 transition-all">
                <div class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-1 flex items-center justify-between">
                  <span>Burn Multiple</span>
                  <Flame size={15} class="text-amber-400" />
                </div>
                <div class="text-xl font-bold text-slate-100 numeric tracking-tight">
                  {eff.burnMultiple}x
                </div>
                <div class="text-[11px] text-amber-400 font-semibold mt-1">
                  {eff.runwayMonths} mo Runway
                </div>
              </div>

              {/* 4. Rule of 40 Score */}
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 relative overflow-hidden group hover:border-slate-700 transition-all">
                <div class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-1 flex items-center justify-between">
                  <span>Rule of 40</span>
                  <Target size={15} class="text-purple-400" />
                </div>
                <div class="text-xl font-bold text-purple-400 numeric tracking-tight">
                  +{eff.ruleOf40Score}
                </div>
                <div class="text-[11px] text-slate-400 mt-1">
                  {eff.yoyArrGrowthPct}% Growth - 26% Op Margin
                </div>
              </div>

              {/* 5. Agent Attach Rate */}
              <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 relative overflow-hidden group hover:border-slate-700 transition-all">
                <div class="text-xs text-slate-400 font-medium uppercase tracking-wider mb-1 flex items-center justify-between">
                  <span>Agent Attach</span>
                  <Cpu size={15} class="text-teal-400" />
                </div>
                <div class="text-xl font-bold text-teal-400 numeric tracking-tight">
                  {ret.agentAttachRate} / 3
                </div>
                <div class="text-[11px] text-slate-400 mt-1">
                  {ret.agentDistribution.triAgent} Clinics with All 3 Agents
                </div>
              </div>

            </div>

            {/* TAB NAVIGATION STRIP */}
            <div class="border-b border-slate-800 flex items-center justify-between overflow-x-auto gap-2">
              <div class="flex items-center gap-1">
                
                <button 
                  onClick={() => setActiveTab('overview')}
                  class={`px-3.5 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'overview' 
                      ? 'border-emerald-500 text-emerald-400 bg-slate-900/50' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Activity size={14} /> Overview
                </button>

                <button 
                  onClick={() => setActiveTab('retention')}
                  class={`px-3.5 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'retention' 
                      ? 'border-emerald-500 text-emerald-400 bg-slate-900/50' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <TrendingUp size={14} /> 3. Retention & Expansion
                </button>

                <button 
                  onClick={() => setActiveTab('health')}
                  class={`px-3.5 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'health' 
                      ? 'border-emerald-500 text-emerald-400 bg-slate-900/50' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Flame size={14} /> 4. Financial Health & Efficiency
                </button>

                <button 
                  onClick={() => setActiveTab('operations')}
                  class={`px-3.5 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'operations' 
                      ? 'border-emerald-500 text-emerald-400 bg-slate-900/50' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Cpu size={14} /> 5. Operational Metrics
                </button>

                <button 
                  onClick={() => setActiveTab('strategic')}
                  class={`px-3.5 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'strategic' 
                      ? 'border-emerald-500 text-emerald-400 bg-slate-900/50' 
                      : 'border-transparent text-slate-400 hover:text-slate-200'
                  }`}
                >
                  <Award size={14} /> 6. Strategic & Risk
                </button>

                <button 
                  onClick={() => setActiveTab('calculator')}
                  class={`px-3.5 py-2.5 text-xs font-semibold border-b-2 transition-all flex items-center gap-1.5 whitespace-nowrap ${
                    activeTab === 'calculator'

                <div class="overflow-x-auto">
                  <table class="w-full text-xs text-left border-collapse">
                    <thead class="bg-slate-950 text-slate-400 font-semibold border-b border-slate-800 uppercase tracking-wider text-[11px]">
                      <tr>
                        <th onClick={() => handleSort('name')} class="p-3 cursor-pointer hover:text-slate-200 transition-colors">
                          Clinic Name {sortField === 'name' && (sortDirection === 'asc' ? '↑' : '↓')}
                        </th>
                        <th onClick={() => handleSort('status')} class="p-3 cursor-pointer hover:text-slate-200 transition-colors">
                          Status {sortField === 'status' && (sortDirection === 'asc' ? '↑' : '↓')}
                        </th>
                        <th onClick={() => handleSort('numGps')} class="p-3 cursor-pointer hover:text-slate-200 transition-colors text-right numeric">
                          GPs {sortField === 'numGps' && (sortDirection === 'asc' ? '↑' : '↓')}
                        </th>
                        <th onClick={() => handleSort('agentCount')} class="p-3 cursor-pointer hover:text-slate-200 transition-colors text-center">
                          Agents {sortField === 'agentCount' && (sortDirection === 'asc' ? '↑' : '↓')}
                        </th>
                        <th onClick={() => handleSort('monthlySubscription')} class="p-3 cursor-pointer hover:text-slate-200 transition-colors text-right numeric">
                          Sub ($/mo) {sortField === 'monthlySubscription' && (sortDirection === 'asc' ? '↑' : '↓')}
                        </th>
                        <th onClick={() => handleSort('uploaderPct')} class="p-3 cursor-pointer hover:text-slate-200 transition-colors text-right numeric">
                          Uploader % {sortField === 'uploaderPct' && (sortDirection === 'asc' ? '↑' : '↓')}
                        </th>
                        <th onClick={() => handleSort('avgAccuracy')} class="p-3 cursor-pointer hover:text-slate-200 transition-colors text-right numeric">
                          Avg Accuracy {sortField === 'avgAccuracy' && (sortDirection === 'asc' ? '↑' : '↓')}
                        </th>
                        <th onClick={() => handleSort('totalHoursSaved')} class="p-3 cursor-pointer hover:text-slate-200 transition-colors text-right numeric">
                          Hours Saved {sortField === 'totalHoursSaved' && (sortDirection === 'asc' ? '↑' : '↓')}
                        </th>
                        <th onClick={() => handleSort('financialSavings')} class="p-3 cursor-pointer hover:text-slate-200 transition-colors text-right numeric">
                          Financial ROI ($) {sortField === 'financialSavings' && (sortDirection === 'asc' ? '↑' : '↓')}
                        </th>
                      </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800/60">
                      {paginatedClinics.map((c) => (
                        <tr 
                          key={c.id}
                          onClick={() => setSelectedClinic(c)}
                          class="hover:bg-slate-800/50 cursor-pointer transition-colors group"
                        >
                          <td class="p-3 font-medium text-slate-200 group-hover:text-emerald-400 transition-colors max-w-xs truncate">
                            {c.name}
                          </td>
                          <td class="p-3">{getStatusBadge(c.status)}</td>
                          <td class="p-3 text-right numeric text-slate-300">{c.numGps || '-'}</td>
                          <td class="p-3 text-center">
                            <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[11px] font-bold bg-purple-500/10 text-purple-400 border border-purple-500/20">
                              {c.agentCount} Agents
                            </span>
                          </td>
                          <td class="p-3 text-right numeric text-slate-300">${c.monthlySubscription.toLocaleString()}</td>
                          <td class="p-3 text-right numeric font-medium text-slate-200">
                            {c.uploaderPct > 0 ? `${c.uploaderPct.toFixed(1)}%` : '-'}
                          </td>
                          <td class="p-3 text-right numeric text-slate-300">
                            {c.avgAccuracy > 0 ? (
                              <span class={c.avgAccuracy >= 85 ? 'text-emerald-400 font-semibold' : 'text-amber-400'}>
                                {c.avgAccuracy.toFixed(1)}%
                              </span>
                            ) : '-'}
                          </td>
                          <td class="p-3 text-right numeric text-slate-300">
                            {c.totalHoursSaved > 0 ? `${Math.round(c.totalHoursSaved).toLocaleString()} h` : '-'}
                          </td>
                          <td class="p-3 text-right numeric font-bold text-emerald-400">
                            {c.financialSavings > 0 ? `$${Math.round(c.financialSavings).toLocaleString()}` : '-'}
                          </td>
                        </tr>
                      ))}

                      {paginatedClinics.length === 0 && (
                        <tr>
                          <td colspan="9" class="p-8 text-center text-slate-500">
                            No clinics matched your filter or search query.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>

                <div class="p-3 border-t border-slate-800 flex items-center justify-between text-xs text-slate-400 bg-slate-950">
                  <span>Page {page} of {totalPages}</span>
                  <div class="flex items-center gap-1">
                    <button 
                      onClick={() => setPage(p => Math.max(1, p - 1))}
                      disabled={page === 1}
                      class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-300 border border-slate-700"
                    >
                      Previous
                    </button>
                    <button 
                      onClick={() => setPage(p => Math.min(totalPages, p + 1))}
                      disabled={page === totalPages}
                      class="px-2.5 py-1 rounded bg-slate-800 hover:bg-slate-700 disabled:opacity-40 text-slate-300 border border-slate-700"
                    >
                      Next
                    </button>
                  </div>
                </div>

              </div>
            )}

          </main>

          {/* CLINIC DETAIL MODAL */}
          {selectedClinic && (
            <div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto shadow-2xl p-6 space-y-6">
                
                <div class="flex items-start justify-between border-b border-slate-800 pb-4">
                  <div>
                    <div class="flex items-center gap-2">
                      <h3 class="text-lg font-bold text-slate-100">{selectedClinic.name}</h3>
                      {getStatusBadge(selectedClinic.status)}
                    </div>
                    {selectedClinic.comments && (
                      <p class="text-xs text-amber-400 mt-1 bg-amber-500/10 px-2 py-1 rounded border border-amber-500/20 inline-block">
                        Note: {selectedClinic.comments}
                      </p>
                    )}
                  </div>

                  <button onClick={() => setSelectedClinic(null)} class="p-1 rounded-lg hover:bg-slate-800 text-slate-400 hover:text-slate-200">
                    <X size={18} />
                  </button>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                  <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-400">Total Financial Savings</span>
                    <div class="text-lg font-bold text-emerald-400 numeric mt-1">
                      ${Math.round(selectedClinic.financialSavings).toLocaleString()}
                    </div>
                  </div>

                  <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-400">Hours Reclaimed</span>
                    <div class="text-lg font-bold text-slate-100 numeric mt-1">
                      {Math.round(selectedClinic.totalHoursSaved)} hrs
                    </div>
                  </div>

                  <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-400">Active Agents</span>
                    <div class="text-lg font-bold text-purple-400 numeric mt-1">
                      {selectedClinic.agentCount} / 3 Agents
                    </div>
                  </div>

                  <div class="bg-slate-950 p-3 rounded-lg border border-slate-800">
                    <span class="text-slate-400">Monthly Subscription</span>
                    <div class="text-lg font-bold text-teal-400 numeric mt-1">
                      ${selectedClinic.monthlySubscription}/mo
                    </div>
                  </div>
                </div>

                <div class="space-y-3 bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <h4 class="text-xs font-bold uppercase tracking-wider text-slate-300">Accuracy & Verification Levels</h4>
                  
                  <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center text-xs">
                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                      <div class="text-slate-400 text-[10px]">Layer 1 (OCR)</div>
                      <div class="font-bold text-slate-200 mt-0.5">{selectedClinic.accuracyL1.toFixed(1)}%</div>
                    </div>
                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                      <div class="text-slate-400 text-[10px]">Layer 2 (Entities)</div>
                      <div class="font-bold text-slate-200 mt-0.5">{selectedClinic.accuracyL2.toFixed(1)}%</div>
                    </div>
                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                      <div class="text-slate-400 text-[10px]">Layer 3 (Coding)</div>
                      <div class="font-bold text-slate-200 mt-0.5">{selectedClinic.accuracyL3.toFixed(1)}%</div>
                    </div>
                    <div class="bg-slate-900 p-2 rounded border border-slate-800">
                      <div class="text-slate-400 text-[10px]">Layer 4 (Safety)</div>
                      <div class="font-bold text-slate-200 mt-0.5">{selectedClinic.accuracyL4.toFixed(1)}%</div>
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-2 gap-3 text-xs text-slate-300 bg-slate-950 p-4 rounded-xl border border-slate-800">
                  <div>
                    <span class="text-slate-500">Document Allocations:</span> <strong class="text-slate-200">{selectedClinic.allocations.toLocaleString()}</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Document Uploads:</span> <strong class="text-slate-200">{selectedClinic.uploads.toLocaleString()}</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Pilot Launch Date:</span> <strong class="text-slate-200">{selectedClinic.pilotStartDate || 'N/A'}</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Days Elapsed:</span> <strong class="text-slate-200">{selectedClinic.daysElapsed} days</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">Time Saved / Doc:</span> <strong class="text-emerald-400">{selectedClinic.timePerDocSec.toFixed(1)} seconds</strong>
                  </div>
                  <div>
                    <span class="text-slate-500">NPS Score:</span> <strong class="text-emerald-400">+{selectedClinic.nps}</strong>
                  </div>
                </div>

                <div class="flex justify-end pt-2">
                  <button onClick={() => setSelectedClinic(null)} class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-lg border border-slate-700">
                    Close Details
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer class="border-t border-slate-800 py-4 px-4 text-center text-xs text-slate-500">
            CareGP Financial & Operational Intelligence Dashboard • Connected to Google Sheets ({summary.totalClinics} Medical Practices)
          </footer>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
